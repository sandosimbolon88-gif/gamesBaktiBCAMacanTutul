<!doctype html>
<html><head><meta charset="utf-8"><title>Preview aset</title>
<style>body{margin:0;background:#222;color:#eee;font-family:sans-serif} canvas{display:block}</style></head>
<body>
<canvas id="c" width="1600" height="900"></canvas>
<script src="../js/config.js"></script>
<script src="../js/content.js"></script>
<script src="../js/util.js"></script>
<script src="../js/art/leopard.js"></script>
<script src="../js/art/animals.js"></script>
<script src="../js/art/animal-poses.js"></script>
<script src="../js/art/forest.js"></script>
  <script src="../js/motion.js"></script>
<script src="../js/scene.js"></script>
<script>
const J=JSMT, A=J.Art;
const q=new URLSearchParams(location.search);
const c=document.getElementById('c'), g=c.getContext('2d');
const what=q.get('v')||'sheet';
if(what==='sheet'){
  g.fillStyle='#9cc57f'; g.fillRect(0,0,1600,900);
  let x=40,y=40,rowH=0;
  const put=(sp,label)=>{ if(x+sp.lw>1580){x=40;y+=rowH+30;rowH=0;} g.drawImage(sp.canvas,x,y,sp.lw,sp.lh); g.fillStyle='#000';g.font='14px sans-serif';g.fillText(label,x+4,y+sp.lh+12); g.strokeStyle='rgba(255,0,0,.5)'; g.strokeRect(x - sp.ox + sp.box.x0, y - sp.oy + sp.box.y0, sp.box.x1-sp.box.x0, sp.box.y1-sp.box.y0); x+=sp.lw+20; rowH=Math.max(rowH,sp.lh); };
  for(const v of ['spotted','black']) for(const p of A.POSES) put(A.leopardSprite({pose:p,variant:v,scale:0.9,R:1,flip:false}), v+' '+p);
  put(A.leopardSprite({pose:'sit',variant:'spotted',scale:0.5,R:1,cub:true}),'cub sit');
  put(A.leopardSprite({pose:'walk',variant:'spotted',scale:0.5,R:1,cub:true}),'cub walk');
  for(const t of A.DECOY_TYPES) put(A.animalSprite(t,{scale:0.9,R:1}), t);
  put(A.leopardSprite({pose:'walk',variant:'black',night:true,scale:0.9,R:1}),'blackIR');
} else {
  const st=parseInt(q.get('stage')||'0'); const seed=parseInt(q.get('seed')||'12345');
  const sc=J.Scene.generate(st,{R:1,seed});
  g.save();g.scale(1600/J.W,900/J.H);sc.motion.renderSky(g);g.drawImage(sc.comp,0,0,J.W,J.H);sc.motion.render(g);g.restore();
  if(q.get('reveal')){ for(const it of sc.items){ g.globalAlpha=0.9; g.drawImage(JSMT.Art.glow(it.sp, it.kind==='leopard'?'#ff2d2d':'#2dd3ff'),it.x+it.sp.ox,it.y+it.sp.oy,it.sp.lw,it.sp.lh); g.globalAlpha=1; } }
  if(q.get('boxes')){ g.lineWidth=2; for(const it of sc.items){ g.strokeStyle=it.kind==='leopard'?'red':'cyan'; g.strokeRect(it.box.x0,it.box.y0,it.box.x1-it.box.x0,it.box.y1-it.box.y0); g.fillStyle='#fff'; g.fillText((it.pose||it.type)+' vis '+(it.vis||0).toFixed(2),it.box.x0,it.box.y0-4);} }
  window.__info={gen:sc.genMs, leo:sc.leopards.length, items:sc.items.map(i=>[i.kind,i.pose||i.type,i.variant,+(i.vis||0).toFixed(2)])};
}
</script></body></html>
