        if (p.far) { g.fillStyle = pal.far; g.fill(p.path); }

      if (p.body) {

        g.save(); g.clip(p.path);
        if (b.shade) { g.fillStyle = pal.shade; g.beginPath(); g.ellipse(b.shade[0], b.shade[1], b.shade[2], b.shade[3], 0, 0, TAU); g.fill(); }

          g.beginPath(); g.ellipse(b.belly[0], b.belly[1], b.belly[2], b.belly[3], b.belly[4] || 0, 0, TAU); g.fill();

  A.leopardSprite = function (o) {

  <script>/* js/art/forest.js */
/* Elemen hutan bergaya kartun: pohon, dahan, kanopi, semak, pakis, daun, rumput, batu, kayu tumbang. */
(function () {
  'use strict';
  const J = window.JSMT;
  const A = J.Art;
  const TAU = Math.PI * 2;
  const F = (A.Forest = {});

  F.palette = function (mode) {
    const p = {
      sky0: '#eef7d8', sky1: '#c8e6a4',
      far1T: '#b9d8a0', far1C: '#abd191', far2T: '#95c07d', far2C: '#8bba73',
      ground0: '#93ad52', ground1: '#6c8c35', trail: 'rgba(196,166,104,0.55)', trailHi: 'rgba(222,198,140,0.35)',
      trunk: '#7b5636', trunkDark: '#5a3b22', trunkHi: '#9c7149', outline: '#22331a',
      canopy: '#4b963b', canopyHi: '#74ba55', canopyDark: '#377629',
      bush: '#3e8a37', bushHi: '#67b04f', bushDark: '#2c6a29',
      fern: '#2f7d33', fernHi: '#4c9f43', fernDark: '#1d5622',
      leaf: '#3b9140', leafHi: '#5aac4d', leafVein: '#a6d880',
      grass: '#4f9230', grassHi: '#70b043',
      litter: ['#a7843e', '#8d6b2f', '#bb9549', '#7f903b', '#9c6b35'],
      rock: '#8e948a', rockHi: '#b4b9ae', moss: '#6aa443', vine: '#3d6e2a',
      ray: 'rgba(255,255,225,0.14)', dapple: 'rgba(255,248,190,0.22)'
    };
    if (mode === 'senja') {
      Object.assign(p, { sky0: '#fbe2b6', sky1: '#e6c38b', far1T: '#cdc79a', far1C: '#c3bf8f', far2T: '#aab27f', far2C: '#a2ad76', ray: 'rgba(255,214,150,0.18)' });
    }
    return p;
  };

  function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }

  /* Kumpulan lingkaran ala kartun: garis luar, bayangan bawah, isi, kilap. */
  F.blobs = function (g, cs, fill, hi, outline, olw, dark) {
    if (outline) { g.fillStyle = outline; for (const c of cs) { circ(g, c[0], c[1], c[2] + olw); g.fill(); } }
    if (dark) { g.fillStyle = dark; for (const c of cs) { circ(g, c[0], c[1], c[2]); g.fill(); } }
    g.fillStyle = fill;
    for (const c of cs) { circ(g, c[0] - c[2] * 0.03, c[1] - c[2] * (dark ? 0.1 : 0), c[2] * (dark ? 0.9 : 1)); g.fill(); }
    if (hi) { g.fillStyle = hi; for (const c of cs) { circ(g, c[0] - c[2] * 0.3, c[1] - c[2] * 0.36, c[2] * 0.46); g.fill(); } }
  };

  F.sky = function (g, p, W, y1) {
    const gr = g.createLinearGradient(0, 0, 0, y1);
    gr.addColorStop(0, p.sky0); gr.addColorStop(1, p.sky1);
    g.fillStyle = gr; g.fillRect(0, 0, W, 900);
  };

  F.farLayer = function (g, r, W, yBase, n, trunk, canopy) {
    g.fillStyle = trunk; g.strokeStyle = trunk;
    for (let i = 0; i < n; i++) {
      const x = (i + r.range(0, 0.9)) * (W / n), tw = r.range(10, 28);
      g.beginPath(); g.moveTo(x - tw / 2, yBase + 30); g.lineTo(x - tw * 0.34, -20); g.lineTo(x + tw * 0.34, -20); g.lineTo(x + tw / 2, yBase + 30); g.fill();
      const by = r.range(180, 430), sd = r.chance(0.5) ? 1 : -1;
      g.lineWidth = tw * 0.32; g.lineCap = 'round';
      g.beginPath(); g.moveTo(x, by); g.lineTo(x + sd * r.range(40, 90), by - r.range(25, 60)); g.stroke();
    }
    g.fillStyle = canopy;
    for (let x = -60; x < W + 60; x += r.range(50, 90)) { circ(g, x, r.range(-20, 110), r.range(50, 100)); g.fill(); }
    for (let x = -40; x < W + 40; x += r.range(40, 70)) { circ(g, x, yBase + r.range(-5, 25), r.range(26, 60)); g.fill(); }
  };

  F.rays = function (g, r, p, W, H) {
    const n = r.int(3, 5);
    for (let i = 0; i < n; i++) {
      const x = r.range(60, W - 200), w = r.range(40, 110), sk = r.range(260, 420);
      const gr = g.createLinearGradient(x, 0, x + sk, H * 0.8);
      gr.addColorStop(0, p.ray); gr.addColorStop(1, 'rgba(255,255,225,0)');
      g.fillStyle = gr;
      g.beginPath(); g.moveTo(x, -10); g.lineTo(x + w, -10); g.lineTo(x + w + sk, H * 0.8); g.lineTo(x + sk, H * 0.8); g.closePath(); g.fill();
    }
  };

  F.mist = function (g, W, y0, y1, a) {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, 'rgba(255,255,255,0)');
    gr.addColorStop(0.55, 'rgba(255,255,255,' + a + ')');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, y0, W, y1 - y0);
  };

  F.ground = function (g, r, p, W, H, y0) {
    const path = new Path2D();
    path.moveTo(-10, H + 10); path.lineTo(-10, y0);
    let x = -10, y = y0;
    while (x < W + 10) {
      const nx = x + r.range(160, 320), ny = y0 + r.range(-16, 16);
      path.quadraticCurveTo((x + nx) / 2, (y + ny) / 2 - r.range(4, 20), nx, ny);
      x = nx; y = ny;
    }
    path.lineTo(W + 10, H + 10); path.closePath();
    const gr = g.createLinearGradient(0, y0, 0, H);
    gr.addColorStop(0, p.ground0); gr.addColorStop(1, p.ground1);
    g.fillStyle = gr; g.fill(path);
    g.lineWidth = 3; g.strokeStyle = 'rgba(30,50,20,0.45)'; g.stroke(path);
    // jalur setapak (macan tutul sering melintasi jalur seperti ini)
    g.save(); g.clip(path);
    const ty = r.range(y0 + 110, y0 + 190), ty2 = ty + r.range(-60, 60);
    g.lineCap = 'round';
    g.strokeStyle = p.trail; g.lineWidth = r.range(70, 100);
    g.beginPath(); g.moveTo(-60, ty); g.bezierCurveTo(W * 0.3, ty + r.range(-70, 70), W * 0.65, ty2 + r.range(-70, 70), W + 60, ty2); g.stroke();
    g.strokeStyle = p.trailHi; g.lineWidth *= 0.45;
    g.stroke();
    for (let i = 0; i < 280; i++) {
      const yy = r.range(y0 + 6, H), xx = r.range(0, W);
      const s = 0.6 + (yy - y0) / (H - y0);
      g.fillStyle = r.pick(p.litter); g.globalAlpha = 0.85;
      g.beginPath(); g.ellipse(xx, yy, r.range(3, 7) * s, r.range(1.4, 3) * s, r() * TAU, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
    g.restore();
  };

  F.dapples = function (g, r, p, W, y0, H, n) {
    g.fillStyle = p.dapple;
    for (let i = 0; i < n; i++) { g.beginPath(); g.ellipse(r.range(0, W), r.range(y0 + 20, H), r.range(20, 60), r.range(6, 16), 0, 0, TAU); g.fill(); }
  };

  F.tree = function (g, r, p, x, baseY, w, branches) {
    const topY = -60, wTop = w * 0.62;
    const wig = () => r.range(-w * 0.12, w * 0.12);
    const lx = x - w * 0.5, rx = x + w * 0.5;
    const trunk = new Path2D(
      `M${x - w * 0.85} ${baseY + 4} Q${x - w * 0.52} ${baseY - 6} ${lx} ${baseY - 70} ` +
      `C${lx + wig()} ${baseY * 0.55} ${x - wTop / 2 + wig()} ${baseY * 0.25} ${x - wTop / 2} ${topY} ` +
      `L${x + wTop / 2} ${topY} C${x + wTop / 2 + wig()} ${baseY * 0.25} ${rx + wig()} ${baseY * 0.55} ${rx} ${baseY - 70} ` +
      `Q${x + w * 0.52} ${baseY - 6} ${x + w * 0.85} ${baseY + 4} Z`);
    g.lineJoin = 'round';
    g.lineWidth = 3.5; g.strokeStyle = p.outline; g.stroke(trunk);
    g.fillStyle = p.trunk; g.fill(trunk);
    g.save(); g.clip(trunk);
    g.globalAlpha = 0.55; g.fillStyle = p.trunkDark; g.fillRect(x + w * 0.12, topY, w, baseY - topY + 10);
    g.globalAlpha = 0.4; g.fillStyle = p.trunkHi; g.fillRect(x - w * 0.42, topY, w * 0.16, baseY - topY);
    g.globalAlpha = 1;
    g.strokeStyle = p.trunkDark; g.lineWidth = 2; g.lineCap = 'round';
    for (let k = 0; k < 12; k++) {
      const bx = x + r.range(-w * 0.42, w * 0.3), by = r.range(topY + 40, baseY - 30), bl = r.range(20, 60);
      g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo(bx + r.range(-5, 5), by + bl / 2, bx + r.range(-3, 3), by + bl); g.stroke();
    }
    if (r.chance(0.6)) {
      const kx = x + r.range(-w * 0.2, w * 0.05), ky = r.range(280, baseY - 140);
      g.fillStyle = p.trunkDark; g.beginPath(); g.ellipse(kx, ky, w * 0.11, w * 0.15, 0, 0, TAU); g.fill();
      g.fillStyle = '#3a2615'; g.beginPath(); g.ellipse(kx, ky + 1, w * 0.06, w * 0.09, 0, 0, TAU); g.fill();
    }
    // bekas cakaran macan tutul di batang (kadang-kadang)
    if (r.chance(0.35)) {
      const sx = x - w * 0.18, sy = baseY - r.range(120, 170);
      g.strokeStyle = '#d9b98a'; g.lineWidth = 2.2;
      for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(sx + k * 6, sy); g.quadraticCurveTo(sx + k * 6 + 2, sy + 18, sx + k * 6 - 1, sy + 34); g.stroke(); }
    }
    g.restore();
    const slots = [];
    for (const b of branches) slots.push(F.branch(g, r, p, x, baseY, w, wTop, topY, b));
    return { slots, box: { x0: x - w * 0.85, x1: x + w * 0.85, y0: topY, y1: baseY } };
  };

  F.branch = function (g, r, p, x, baseY, w, wTop, topY, b) {
    const side = b.side;
    const frac = (baseY - b.y) / (baseY - topY);
    const half = J.lerp(w * 0.5, wTop / 2, frac);
    const x0 = x + side * half * 0.3, xe = x + side * (half + b.len), th = b.thick;
    const yT0 = b.y - th / 2, yTE = yT0 + b.slope * b.len, tipTh = 8;
    const sag = yT0 + th + 6 + b.slope * b.len * 0.5;
    const fillP = new Path2D();
    fillP.moveTo(x0, yT0); fillP.lineTo(xe, yTE);
    fillP.quadraticCurveTo(xe + side * 7, yTE + tipTh / 2, xe, yTE + tipTh);
    fillP.quadraticCurveTo((x0 + xe) / 2, sag, x0, yT0 + th + 2);
    fillP.closePath();
    const edge = x + side * half * 0.96;
    const yEdge = yT0 + (b.slope * (edge - x0)) / side;
    const lineP = new Path2D();
    lineP.moveTo(edge, yEdge); lineP.lineTo(xe, yTE);
    lineP.quadraticCurveTo(xe + side * 7, yTE + tipTh / 2, xe, yTE + tipTh);
    lineP.quadraticCurveTo((x0 + xe) / 2, sag, edge, yT0 + th + 2);
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.lineWidth = 7; g.strokeStyle = p.outline; g.stroke(lineP);
    g.fillStyle = p.trunk; g.fill(fillP);
    g.save(); g.clip(fillP);
    g.globalAlpha = 0.5; g.fillStyle = p.trunkDark;
    g.beginPath(); g.moveTo(x0, yT0 + th * 0.55); g.lineTo(xe, yTE + tipTh * 0.5); g.lineTo(xe, yTE + 40); g.lineTo(x0, yT0 + th + 30); g.fill();
    g.globalAlpha = 0.6; g.strokeStyle = p.trunkHi; g.lineWidth = 3;
    g.beginPath(); g.moveTo(edge, yEdge + 3); g.lineTo(xe, yTE + 2); g.stroke();
    g.globalAlpha = 1;
    g.restore();
    // daun di ujung dahan
    const cs = [];
    const n = r.int(4, 7);
    for (let k = 0; k < n; k++) cs.push([xe + side * r.range(-28, 26), yTE + r.range(-46, 12), r.range(18, 34)]);
    F.blobs(g, cs, p.canopy, p.canopyHi, p.outline, 3, p.canopyDark);
    const sx0 = x + side * (half + 6), sx1 = x + side * (half + b.len * 0.72);
    const slope = (yTE - yT0) / (xe - x0);
    return { x0: Math.min(sx0, sx1), x1: Math.max(sx0, sx1), side, y: (px) => yT0 + slope * (px - x0), used: false };
  };

  F.canopy = function (g, r, p, W, low) {
    low = low || 0;
    const cs = [];
    for (let x = -80; x < W + 80; x += r.range(70, 120)) {
      const base = r.range(10, 70) + low * r.range(40, 90), n = r.int(3, 5);
      for (let k = 0; k < n; k++) cs.push([x + r.range(-50, 50), base + r.range(-60, 36), r.range(50, 92)]);
    }
    F.blobs(g, cs, p.canopy, p.canopyHi, p.outline, 3.5, p.canopyDark);
    g.strokeStyle = 'rgba(20,60,20,0.35)'; g.lineWidth = 2; g.lineCap = 'round';
    for (let i = 0; i < 60; i++) {
      const c = r.pick(cs), a = r() * TAU, d = c[2] * r.range(0.2, 0.8);
      const px = c[0] + Math.cos(a) * d, py = c[1] + Math.sin(a) * d;
      g.beginPath(); g.arc(px, py, r.range(5, 10), 0.2, 1.6); g.stroke();
    }
  };

  F.bush = function (g, r, x, y, w, h, p, o) {
    o = o || {};
    const n = Math.max(4, Math.round(w / 34));
    const cs = [];
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0.5 : i / (n - 1), dome = Math.sin(Math.PI * (0.15 + 0.7 * t));
      const rad = h * 0.34 * (0.75 + 0.45 * dome) * r.range(0.88, 1.12);
      cs.push([x - w / 2 + w * (0.1 + 0.8 * t) + r.range(-6, 6), y - rad * 0.55 - dome * h * 0.4, rad]);
    }
    for (let i = 0; i < Math.ceil(n * 0.6); i++) { const rad = h * 0.26 * r.range(0.85, 1.1); cs.push([x - w / 2 + r() * w, y - rad * 0.4, rad]); }
    for (let i = 0; i < Math.ceil(n * 0.4); i++) { const rad = h * 0.22 * r.range(0.8, 1.1); cs.push([x - w * 0.3 + r() * w * 0.6, y - h * 0.7 + r.range(-8, 8), rad]); }
    g.save();
    g.beginPath(); g.rect(x - w * 1.5, y - h * 3, w * 3, h * 3 + (o.below == null ? 6 : o.below)); g.clip();
    F.blobs(g, cs, o.fill || p.bush, o.hi || p.bushHi, p.outline, o.olw || 3, o.dark || p.bushDark);
    g.strokeStyle = 'rgba(15,45,15,0.35)'; g.lineWidth = 1.8; g.lineCap = 'round';
    for (let k = 0; k < n * 2; k++) {
      const c = r.pick(cs), a = r() * TAU, d = c[2] * r.range(0.2, 0.7);
      g.beginPath(); g.arc(c[0] + Math.cos(a) * d, c[1] + Math.sin(a) * d, r.range(4, 8), 0.3, 1.8); g.stroke();
    }
    g.restore();
    return { x0: x - w / 2 - 12, y0: y - h * 1.05, x1: x + w / 2 + 12, y1: y + 8 };
  };

  /* Gerombol daun mengambang (untuk menutupi dahan). */
  F.foliage = function (g, r, x, y, rad, p) {
    const cs = [];
    const n = r.int(4, 7);
    for (let i = 0; i < n; i++) { const a = r() * TAU, d = rad * r.range(0, 0.55); cs.push([x + Math.cos(a) * d, y + Math.sin(a) * d * 0.7, rad * r.range(0.35, 0.55)]); }
    F.blobs(g, cs, p.canopy, p.canopyHi, p.outline, 3, p.canopyDark);
    return { x0: x - rad * 1.1, y0: y - rad * 0.95, x1: x + rad * 1.1, y1: y + rad * 0.95 };
  };

  function frond(g, x, y, a, len, col, p, o) {
    o = o || {};
    const dx = Math.cos(a), dy = Math.sin(a);
    const droop = len * (o.droop || 0.32) * (Math.abs(dx) + 0.25);
    const cx = x + dx * len * 0.55, cy = y + dy * len * 0.55;
    const tx = x + dx * len, ty = y + dy * len + droop;
    const pts = [], N = 13;
    for (let i = 1; i <= N; i++) {
      const t = i / (N + 1), it = 1 - t;
      const px = it * it * x + 2 * it * t * cx + t * t * tx, py = it * it * y + 2 * it * t * cy + t * t * ty;
      const ddx = 2 * it * (cx - x) + 2 * t * (tx - cx), ddy = 2 * it * (cy - y) + 2 * t * (ty - cy);
      const L = Math.hypot(ddx, ddy) || 1;
      pts.push([px, py, ddx / L, ddy / L, t]);
    }
    const leafL = len * (o.leafL || 0.2), leafW = o.leafW || 0.2;
    for (let pass = 0; pass < 2; pass++) {
      g.fillStyle = pass === 0 ? p.outline : col;
      const grow = pass === 0 ? 1.7 : 0;
      for (const [px, py, ux, uy, t] of pts) {
        const l = leafL * (1 - t * 0.7), nx = -uy, ny = ux;
        for (const s of [-1, 1]) {
          const vx = nx * s + ux * 0.5, vy = ny * s + uy * 0.5;
          const ang = Math.atan2(vy, vx);
          g.beginPath();
          g.ellipse(px + vx * l * 0.48, py + vy * l * 0.48, l * 0.55 + grow, l * leafW + grow, ang, 0, TAU);
          g.fill();
        }
      }
      g.beginPath(); g.ellipse(tx, ty, leafL * 0.28 + grow, leafL * 0.14 + grow, Math.atan2(ty - cy, tx - cx), 0, TAU); g.fill();
    }
    g.strokeStyle = p.fernDark; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(cx, cy, tx, ty); g.stroke();
  }

  F.fern = function (g, r, x, y, size, p, o) {
    o = o || {};
    const n = o.n || r.int(6, 9), spread = o.spread || 1.25, base = o.angle == null ? -Math.PI / 2 : o.angle;
    const fr = [];
    for (let i = 0; i < n; i++) {
      const a = base + (n === 1 ? 0 : (i / (n - 1) - 0.5) * 2 * spread) + r.range(-0.12, 0.12);
      fr.push({ a, len: size * r.range(0.7, 1.05), col: r.chance(0.5) ? p.fern : p.fernHi });
    }
    fr.sort((a, b) => Math.abs(b.a - base) - Math.abs(a.a - base));
    for (const f of fr) frond(g, x, y, f.a, f.len, f.col, p);
    return { x0: x - size * 1.05, y0: y - size * 1.0, x1: x + size * 1.05, y1: y + 6 };
  };

  F.leaf = function (g, x, y, len, ang, p, o) {
    o = o || {};
    const wd = o.wid || 0.3, col = o.col || p.leaf;
    g.save(); g.translate(x, y); g.rotate(ang);
    const path = new Path2D(`M0 0 C${len * 0.22} ${-len * wd} ${len * 0.72} ${-len * wd * 0.95} ${len} 0 C${len * 0.72} ${len * wd * 0.95} ${len * 0.22} ${len * wd} 0 0 Z`);
    g.lineJoin = 'round';
    g.lineWidth = o.olw || 3; g.strokeStyle = p.outline; g.stroke(path);
    g.fillStyle = col; g.fill(path);
    g.save(); g.clip(path); g.fillStyle = 'rgba(10,40,10,0.16)'; g.fillRect(0, 0, len, len * wd); g.restore();
    g.strokeStyle = p.leafVein; g.lineCap = 'round';
    g.lineWidth = Math.max(1.2, len * 0.025);
    g.beginPath(); g.moveTo(len * 0.04, 0); g.quadraticCurveTo(len * 0.5, -len * 0.02, len * 0.94, 0); g.stroke();
    g.lineWidth = Math.max(0.8, len * 0.014);
    g.beginPath();
    for (let k = 1; k <= 5; k++) {
      const vx = (len * k) / 6.4;
      g.moveTo(vx, 0); g.quadraticCurveTo(vx + len * 0.06, -len * wd * 0.3, vx + len * 0.13, -len * wd * 0.62);
      g.moveTo(vx, 0); g.quadraticCurveTo(vx + len * 0.06, len * wd * 0.3, vx + len * 0.13, len * wd * 0.62);
    }
    g.stroke();
    g.restore();
  };

  F.leafSpray = function (g, r, x, y, size, p, dir) {
    const n = r.int(3, 6);
    for (let i = 0; i < n; i++) {
      F.leaf(g, x, y, size * r.range(0.65, 1), dir + r.range(-0.85, 0.85), p, { col: r.chance(0.5) ? p.leaf : p.leafHi, wid: r.range(0.26, 0.34) });
    }
    return { x0: x - size, y0: y - size, x1: x + size, y1: y + size };
  };

  F.grass = function (g, r, x, y, h, p) {
    const n = r.int(7, 12);
    g.lineJoin = 'round';
    for (let i = 0; i < n; i++) {
      const bx = x + r.range(-h * 0.35, h * 0.35), lean = r.range(-h * 0.45, h * 0.45), th = h * r.range(0.55, 1), w = r.range(3, 6);
      const path = new Path2D(`M${bx - w} ${y} Q${bx + lean * 0.3} ${y - th * 0.6} ${bx + lean} ${y - th} Q${bx + lean * 0.3 + w * 0.4} ${y - th * 0.55} ${bx + w} ${y} Z`);
      g.lineWidth = 2; g.strokeStyle = p.outline; g.stroke(path);
      g.fillStyle = r.chance(0.5) ? p.grass : p.grassHi; g.fill(path);
    }
    return { x0: x - h * 0.8, y0: y - h, x1: x + h * 0.8, y1: y + 4 };
  };

  F.vine = function (g, r, p, x, y0, len, o) {
    o = o || {};
    const amp = r.range(10, 30), ph = r.range(0, TAU), pts = [];
    for (let i = 0; i <= 20; i++) { const t = i / 20; pts.push([x + Math.sin(ph + t * 4) * amp * t, y0 + len * t]); }
    const poly = () => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const q of pts) g.lineTo(q[0], q[1]); g.stroke(); };
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = p.outline; g.lineWidth = 5; poly();
    g.strokeStyle = p.vine; g.lineWidth = 2.6; poly();
    const big = o.big || 1;
    for (let i = 2; i < pts.length; i += 2) {
      const left = (i / 2) % 2 === 0;
      F.leaf(g, pts[i][0], pts[i][1], r.range(14, 24) * big, left ? Math.PI - r.range(0.4, 1.1) : r.range(0.4, 1.1), p, { wid: 0.36, olw: 2, col: left ? p.leaf : p.leafHi });
    }
    return { x0: x - amp - 30 * big, y0: y0, x1: x + amp + 30 * big, y1: y0 + len + 20 };
  };

  F.rock = function (g, r, p, x, y, w, h) {
    const n = 9, pts = [];
    for (let i = 0; i < n; i++) {
      const a = Math.PI + (i / (n - 1)) * Math.PI;
      pts.push([x + Math.cos(a) * w * 0.5 * r.range(0.9, 1.05), y + Math.sin(a) * h * r.range(0.85, 1.05)]);
    }
    const path = new Path2D();
    path.moveTo(x - w * 0.52, y + 2);
    for (let i = 0; i < n - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      path.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    }
    path.lineTo(x + w * 0.52, y + 2); path.closePath();
    g.lineWidth = 3; g.strokeStyle = p.outline; g.stroke(path);
    g.fillStyle = p.rock; g.fill(path);
    g.save(); g.clip(path);
    g.fillStyle = p.rockHi; g.beginPath(); g.ellipse(x - w * 0.15, y - h * 0.7, w * 0.25, h * 0.22, -0.2, 0, TAU); g.fill();
    g.fillStyle = 'rgba(0,0,0,0.15)'; g.fillRect(x - w, y - h * 0.3, w * 2, h);
    g.fillStyle = p.moss;
    for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(x + r.range(-w * 0.3, w * 0.3), y - h * r.range(0.75, 1), r.range(5, 10), 0, TAU); g.fill(); }
    g.restore();
    return { x0: x - w * 0.55, y0: y - h, x1: x + w * 0.55, y1: y + 2 };
  };

  F.log = function (g, r, p, x, y, len, rad) {
    const body = new Path2D();
    body.moveTo(x, y - rad * 2); body.lineTo(x + len, y - rad * 2);
    body.quadraticCurveTo(x + len + rad * 0.55, y - rad, x + len, y);
    body.lineTo(x, y);
    body.quadraticCurveTo(x - rad * 0.5, y - rad, x, y - rad * 2);
    g.lineWidth = 3; g.strokeStyle = p.outline; g.stroke(body);
    g.fillStyle = p.trunk; g.fill(body);
    g.save(); g.clip(body);
    g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(x - rad, y - rad * 0.8, len + rad * 2, rad);
    g.strokeStyle = p.trunkDark; g.lineWidth = 2;
    for (let i = 0; i < 7; i++) { const yy = y - rad * r.range(0.3, 1.7), xx = x + r.range(0, len * 0.8); g.beginPath(); g.moveTo(xx, yy); g.lineTo(xx + r.range(20, 60), yy + r.range(-2, 2)); g.stroke(); }
    g.restore();
    const end = new Path2D(); end.ellipse(x + len, y - rad, rad * 0.42, rad, 0, 0, TAU);
    g.lineWidth = 3; g.strokeStyle = p.outline; g.stroke(end);
    g.fillStyle = '#c9a06a'; g.fill(end);
    g.strokeStyle = '#9a7448'; g.lineWidth = 1.6;
    for (const k of [0.7, 0.45, 0.2]) { g.beginPath(); g.ellipse(x + len, y - rad, rad * 0.42 * k, rad * k, 0, 0, TAU); g.stroke(); }
    g.fillStyle = p.moss;
    for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(x + r.range(0, len), y - rad * 2 + 2, r.range(4, 9), Math.PI, 0); g.fill(); }
    return { x0: x - rad, y0: y - rad * 2 - 6, x1: x + len + rad, y1: y + 2 };
  };

  /* Tumpukan daun kering oranye-cokelat: kamuflase alami bagi macan tutul. */
  F.dryLeaves = function (g, r, x, y, w) {
    const cols = ['#c98a3a', '#a8662a', '#d9a24c', '#8a5424', '#b9793a'];
    const n = Math.round(w / 6);
    for (let i = 0; i < n; i++) {
      const lx = x + r.range(-w / 2, w / 2), ly = y + r.range(-w * 0.12, w * 0.12) * (1 - Math.abs(lx - x) / w);
      const len = r.range(9, 16), a = r() * TAU;
      g.save(); g.translate(lx, ly); g.rotate(a);
      g.beginPath(); g.ellipse(0, 0, len, len * 0.42, 0, 0, TAU);
      g.fillStyle = r.pick(cols); g.fill();
      g.lineWidth = 1.4; g.strokeStyle = 'rgba(60,30,10,0.7)'; g.stroke();
      g.beginPath(); g.moveTo(-len, 0); g.lineTo(len, 0); g.strokeStyle = 'rgba(70,35,10,0.55)'; g.lineWidth = 1; g.stroke();
      g.restore();
    }
    return { x0: x - w / 2, y0: y - w * 0.15, x1: x + w / 2, y1: y + w * 0.15 };
  };

  /* Bayangan gelap di bawah semak/pohon — tempat macan kumbang sulit terlihat. */
  F.shadowPatch = function (g, x, y, rx, ry) {
    const gr = g.createRadialGradient(x, y, 0, x, y, rx);
    gr.addColorStop(0, 'rgba(12,30,10,0.5)');
    gr.addColorStop(1, 'rgba(12,30,10,0)');
    g.save(); g.translate(x, y); g.scale(1, ry / rx); g.translate(-x, -y);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, rx, 0, TAU); g.fill();
    g.restore();
  };

  /* Bunga oranye kecil di semak (warna mirip macan tutul). */
  F.flowers = function (g, r, x, y, w, h) {
    const n = r.int(4, 8);
    for (let i = 0; i < n; i++) {
      const fx = x + r.range(-w * 0.4, w * 0.4), fy = y - r.range(h * 0.2, h * 0.9), s = r.range(4, 7);
      g.fillStyle = r.pick(['#f08a3c', '#f5b041', '#e46b2c']);
      for (let k = 0; k < 5; k++) { const a = (k / 5) * TAU; g.beginPath(); g.arc(fx + Math.cos(a) * s, fy + Math.sin(a) * s, s * 0.7, 0, TAU); g.fill(); }
      g.fillStyle = '#5a2a0a'; g.beginPath(); g.arc(fx, fy, s * 0.45, 0, TAU); g.fill();
    }
  };

  /* Palet pakis/daun kering (cokelat-oranye) — warnanya mirip macan tutul. */
  F.dryPalette = function (p) {
    return Object.assign({}, p, {
      fern: '#b47b3c', fernHi: '#cf9b52', fernDark: '#7a4e22',
      leaf: '#b8843f', leafHi: '#d3a257', leafVein: '#ecd09a', grass: '#b49448', grassHi: '#cdb062'
    });
  };

  /* Pakis haji (paku pohon) — khas hutan pegunungan Jawa. */
  F.treeFern = function (g, r, p, x, baseY, h, size) {
    const topX = x + r.range(-18, 18), topY = baseY - h;
    const trunk = new Path2D(`M${x} ${baseY} Q${x + r.range(-14, 14)} ${(baseY + topY) / 2} ${topX} ${topY}`);
    g.lineCap = 'round';
    g.strokeStyle = p.outline; g.lineWidth = 18; g.stroke(trunk);
    g.strokeStyle = '#5b4330'; g.lineWidth = 12.5; g.stroke(trunk);
    g.strokeStyle = '#3e2c1e'; g.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
      const t = r(), px = J.lerp(x, topX, t) + r.range(-3, 3), py = J.lerp(baseY, topY, t);
      g.beginPath(); g.moveTo(px - 5, py); g.lineTo(px + 5, py - 3); g.stroke();
    }
    const n = r.int(9, 13), fr = [];
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i / (n - 1) - 0.5) * Math.PI * 1.85 + r.range(-0.1, 0.1);
      fr.push({ a, len: size * r.range(0.75, 1.05), col: r.chance(0.5) ? p.fern : p.fernHi });
    }
    fr.sort((A, B) => Math.sin(A.a) - Math.sin(B.a));
    for (const f of fr) frond(g, topX, topY, f.a, f.len, f.col, p, { droop: 0.42 });
    g.fillStyle = p.fernDark; circ(g, topX, topY, 8); g.fill();
    return { x0: topX - size * 1.15, y0: topY - size * 0.85, x1: topX + size * 1.15, y1: baseY + 4 };
  };

  /* Rumpun rotan/palem: pelepah panjang melengkung. */
  F.palm = function (g, r, p, x, y, size) {
    const n = r.int(4, 7);
    for (let i = 0; i < n; i++) {
      frond(g, x, y, -Math.PI / 2 + r.range(-1.15, 1.15), size * r.range(0.8, 1.1), r.chance(0.5) ? p.leaf : p.leafHi, p, { leafL: 0.26, leafW: 0.09, droop: 0.4 });
    }
    return { x0: x - size * 1.15, y0: y - size * 1.05, x1: x + size * 1.15, y1: y + 6 };
  };

  /* Pohon muda kurus dengan mahkota daun. */
  F.sapling = function (g, r, p, x, baseY, topY) {
    const w = r.range(8, 15), tx = x + r.range(-14, 14);
    const trunk = new Path2D(`M${x} ${baseY} Q${x + r.range(-26, 26)} ${(baseY + topY) / 2} ${tx} ${topY}`);
    g.lineCap = 'round';
    g.strokeStyle = p.outline; g.lineWidth = w + 5; g.stroke(trunk);
    g.strokeStyle = p.trunk; g.lineWidth = w; g.stroke(trunk);
    const cs = [], n = r.int(5, 9), rad = r.range(42, 70);
    for (let i = 0; i < n; i++) { const a = r() * TAU, d = rad * r.range(0, 0.6); cs.push([tx + Math.cos(a) * d * 1.2, topY + Math.sin(a) * d * 0.6, rad * r.range(0.42, 0.62)]); }
    F.blobs(g, cs, r.chance(0.5) ? p.canopy : p.bush, p.canopyHi, p.outline, 3, p.canopyDark);
    return { x0: Math.min(x, tx) - rad * 1.3, y0: topY - rad * 0.95, x1: Math.max(x, tx) + rad * 1.3, y1: baseY + 4 };
  };

  /* Gerombol daun yang menggantung dari kanopi. */
  F.drape = function (g, r, p, x, y0, len) {
    const vb = F.vine(g, r, p, x, y0, len, { big: 1.1 });
    const fb = F.foliage(g, r, x + r.range(-12, 12), y0 + len, r.range(34, 56), p);
    return { x0: Math.min(vb.x0, fb.x0), y0: y0, x1: Math.max(vb.x1, fb.x1), y1: fb.y1 };
  };

  /* Semak bawah di kejauhan yang rapat dan agak buram. */
  F.understory = function (g, r, p, W, groundY, dens) {
    const cs = [];
    for (let x = -40; x < W + 40; x += r.range(28, 52)) cs.push([x, groundY - r.range(10, 150 * (0.4 + dens)), r.range(30, 70)]);
    g.save(); g.globalAlpha = 0.85;
    F.blobs(g, cs, '#5f9a4c', '#78ae5d', null, 0, '#4d843f');
    g.restore();
  };

  /* Cahaya belang-belang: bayangan kanopi + bintik sinar matahari.
     Jatuh juga di tubuh macan tutul sehingga siluetnya pecah — kamuflase alami. */
  F.dapple = function (g, r, W, H, s, groundY, night) {
    if (!(s > 0)) return;
    g.save();
    g.globalCompositeOperation = 'multiply';
    const n = Math.round(12 + 20 * s);
    for (let i = 0; i < n; i++) {
      const x = r.range(-100, W + 100), y = r.range(130, H), rad = r.range(80, 230);
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, 'rgba(38,70,34,' + (0.6 * s) + ')');
      gr.addColorStop(1, 'rgba(38,70,34,0)');
      g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    const lg = g.createLinearGradient(0, groundY - 260, 0, H);
    lg.addColorStop(0, 'rgba(70,100,60,0)');
    lg.addColorStop(0.45, 'rgba(70,100,60,' + (0.4 * s) + ')');
    lg.addColorStop(1, 'rgba(70,100,60,' + (0.22 * s) + ')');
    g.fillStyle = lg; g.fillRect(0, groundY - 260, W, H);
    if (!night) {
      g.globalCompositeOperation = 'soft-light';
      const zones = r.int(4, 7);
      for (let z = 0; z < zones; z++) {
        const zx = r.range(0, W), zy = r.range(220, H - 30), m = Math.round(24 + 46 * s);
        for (let k = 0; k < m; k++) {
          const x = zx + r.range(-190, 190), y = zy + r.range(-100, 100), rr = r.range(4, 15);
          const gr = g.createRadialGradient(x, y, 0, x, y, rr);
          const al = r.range(0.25, 0.5) * s;
          gr.addColorStop(0, 'rgba(255,226,130,' + al + ')');
          gr.addColorStop(0.6, 'rgba(255,226,130,' + al * 0.6 + ')');
          gr.addColorStop(1, 'rgba(255,226,130,0)');
          g.fillStyle = gr;
          g.save(); g.translate(x, y); g.scale(1.4, 1); g.translate(-x, -y);
          g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
          g.restore();
        }
      }
    }
    g.restore();
  };

  F.vignette = function (W, H, R, strength) {
    const c = J.makeCanvas(W * R, H * R), g = c.getContext('2d');
    g.scale(R, R);
    const gr = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.02);
    gr.addColorStop(0, 'rgba(0,0,0,0)');
    gr.addColorStop(1, 'rgba(0,0,0,' + (strength || 0.42) + ')');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    return c;
  };
})();

</script>
  <script>/* js/scene.js */
/* Generator "Stasiun Kamera": merakit hutan lebat acak dengan lapisan kedalaman,
   menyembunyikan macan tutul & satwa pengecoh di antara tanaman, memberi cahaya belang-belang
   (kamuflase alami), lalu memastikan setiap macan tutul tetap terlihat sebagian.
   Hanya bagian tubuh yang TERLIHAT yang bisa diklik. */
(function () {
  'use strict';
  const J = window.JSMT, A = J.Art, F = A.Forest;
  const CFG = window.JSMT_CONFIG, C = window.JSMT_CONTENT;
  const W = J.W, H = J.H;
  const S = (J.Scene = {});

  S.difficulty = function (i) {
    const st = CFG.stages;
    if (i < st.length) return Object.assign({ stage: i }, st[i]);
    const e = CFG.endless, k = i - st.length;
    return Object.assign({ stage: i }, e, { mode: e.modes[k % e.modes.length], scale: Math.max(e.minScale, e.scale - k * 0.012) });
  };

  function labelFor(it) {
    if (it.cub) return it.variant === 'black' ? C.labels.cubBlack : C.labels.cub;
    return it.variant === 'black' ? C.labels.black : C.labels.spotted;
  }

  /* Buat stasiun; ulangi dengan seed lain jika macan tutul gagal ditempatkan. */
  S.generate = function (stage, opts) {
    opts = Object.assign({}, opts);
    let sc = null;
    for (let i = 0; i < 6; i++) {
      sc = generateOnce(stage, opts);
      const need = Math.min(2, (opts.diff || S.difficulty(stage)).count[0]);
      if (sc.leopards.length >= need) return sc;
      opts.seed = J.rng(sc.seed + 7919 * (i + 1)).seed();
    }
    return sc;
  };

  /* ---------- tanaman sebagai objek berlapis ---------- */
  /* Perkiraan batas gambar tiap tanaman (sengaja dilebihkan supaya perhitungan "terlihat" akurat). */
  function vegBox(t, a) {
    switch (t) {
      case 'fern': return { x0: a.x - a.size * 1.3, y0: a.y - a.size * 1.12, x1: a.x + a.size * 1.3, y1: a.y + a.size * 0.5 };
      case 'grass': return { x0: a.x - a.h * 0.9, y0: a.y - a.h - 4, x1: a.x + a.h * 0.9, y1: a.y + 4 };
      case 'spray': return { x0: a.x - a.size * 1.08, y0: a.y - a.size * 1.08, x1: a.x + a.size * 1.08, y1: a.y + a.size * 1.08 };
      case 'vine': return { x0: a.x - 75, y0: a.y - 10, x1: a.x + 75, y1: a.y + a.len + 35 };
      case 'drape': return { x0: a.x - 95, y0: a.y - 10, x1: a.x + 95, y1: a.y + a.len + 75 };
      case 'bush': return { x0: a.x - a.w / 2 - 16, y0: a.y - a.h * 1.12, x1: a.x + a.w / 2 + 16, y1: a.y + 10 };
      case 'foliage': return { x0: a.x - a.rad * 1.15 - 4, y0: a.y - a.rad - 4, x1: a.x + a.rad * 1.15 + 4, y1: a.y + a.rad + 4 };
      case 'treefern': return { x0: a.x - a.size * 1.35 - 20, y0: a.y - a.h - a.size * 1.12, x1: a.x + a.size * 1.35 + 20, y1: Math.max(a.y + 4, a.y - a.h + a.size * 0.75) };
      case 'palm': return { x0: a.x - a.size * 1.45, y0: a.y - a.size * 1.2, x1: a.x + a.size * 1.45, y1: a.y + a.size * 0.55 };
      case 'sapling': return { x0: a.x - 145, y0: a.top - 75, x1: a.x + 145, y1: a.y + 6 };
      case 'trunk': { const fr = a.w * 1.2 + 40; return { x0: a.x - Math.max(a.w * 0.9, fr * 1.15) - 4, y0: 140 - fr - 4, x1: a.x + Math.max(a.w * 0.9, fr * 1.15) + 4, y1: a.y + 8 }; }
      default: return { x0: 0, y0: 0, x1: W, y1: H };
    }
  }
  function drawVeg(g, v, p) {
    const r = J.rng(v.seed), a = v.a, pp = a.dry ? F.dryPalette(p) : p;
    switch (v.type) {
      case 'fern': F.fern(g, r, a.x, a.y, a.size, pp, a.angle != null ? { angle: a.angle } : null); break;
      case 'grass': F.grass(g, r, a.x, a.y, a.h, pp); break;
      case 'spray': F.leafSpray(g, r, a.x, a.y, a.size, pp, a.dir); break;
      case 'vine': F.vine(g, r, p, a.x, a.y, a.len, { big: 1.2 }); break;
      case 'drape': F.drape(g, r, p, a.x, a.y, a.len); break;
      case 'bush': F.bush(g, r, a.x, a.y, a.w, a.h, p); if (a.flowers) F.flowers(g, r, a.x, a.y, a.w, a.h); break;
      case 'foliage': F.foliage(g, r, a.x, a.y, a.rad, p); break;
      case 'treefern': F.treeFern(g, r, p, a.x, a.y, a.h, a.size); break;
      case 'palm': F.palm(g, r, pp, a.x, a.y, a.size); break;
      case 'sapling': F.sapling(g, r, p, a.x, a.y, a.top); break;
      case 'trunk': // batang di depan; puncaknya menyatu ke rimbun daun
        g.save(); g.beginPath(); g.rect(-50, 120, W + 100, H); g.clip();
        F.tree(g, r, p, a.x, a.y, a.w, []);
        g.restore();
        F.foliage(g, r, a.x, 140, a.w * 1.2 + 40, p);
        break;
    }
  }
  function drawObj(g, o, p) {
    if (o.kind === 'animal') { const it = o.it, sp = it.sp; g.drawImage(sp.canvas, it.x + sp.ox, it.y + sp.oy, sp.lw, sp.lh); }
    else drawVeg(g, o, p);
  }

  function generateOnce(stage, opts) {
    const t0 = performance.now();
    const R = opts.R || J.R || 1;
    const seed = (opts.seed >>> 0) || J.randomSeed();
    const r = J.rng(seed);
    const d = Object.assign({ density: 0.6, light: 0.5, camo: 0.4, hide: 0, occl: 0.3, minVis: 0.5 }, opts.diff || S.difficulty(stage));
    const mode = opts.mode || d.mode;
    const night = mode === 'malam';
    const p = F.palette(mode);
    const dens = d.density, camo = d.camo;

    /* ================= latar belakang (selalu di belakang) ================= */
    const bg = J.makeCanvas(W * R, H * R);
    const g = bg.getContext('2d');
    g.setTransform(R, 0, 0, R, 0, 0);
    const groundY = r.range(570, 610);
    F.sky(g, p, W, groundY);
    F.farLayer(g, J.rng(r.seed()), W, groundY - 10, Math.round(16 + 10 * dens), p.far1T, p.far1C);
    if (!night) F.rays(g, J.rng(r.seed()), p, W, H);
    if (mode === 'pagi') F.mist(g, W, groundY - 340, groundY + 40, 0.6);
    F.farLayer(g, J.rng(r.seed()), W, groundY + 10, Math.round(10 + 8 * dens), p.far2T, p.far2C);
    if (mode === 'pagi') F.mist(g, W, groundY - 220, groundY + 70, 0.38);
    F.understory(g, J.rng(r.seed()), p, W, groundY + 10, dens);
    F.ground(g, J.rng(r.seed()), p, W, H, groundY);
    for (let i = 0, n = Math.round(camo * r.range(6, 11)); i < n; i++) {
      F.dryLeaves(g, J.rng(r.seed()), r.range(40, W - 40), r.range(groundY + 30, H - 20), r.range(60, 150));
    }
    for (let i = 0, n = Math.round(2 + camo * 4); i < n; i++) {
      F.shadowPatch(g, r.range(60, W - 60), r.range(groundY + 40, H - 30), r.range(120, 240), r.range(30, 60));
    }
    // pohon besar berdahan (tempat macan tutul bersantai)
    const nT = r.int(3, 5), seg = W / nT;
    const slots = [], trees = [];
    for (let i = 0; i < nT; i++) {
      trees.push({ x: seg * (i + 0.5) + r.range(-seg * 0.2, seg * 0.2), w: r.range(54, 86), base: groundY + r.range(20, 60) });
    }
    for (let i = 0; i < nT; i++) {
      const { x, w, base } = trees[i];
      const roomL = (i > 0 ? x - trees[i - 1].x - trees[i - 1].w * 0.6 : x + 40) - w * 0.5 - 70;
      const roomR = (i < nT - 1 ? trees[i + 1].x - x - trees[i + 1].w * 0.6 : W - x + 40) - w * 0.5 - 70;
      const nb = r.int(1, 3), brs = [], usedY = [];
      for (let k = 0; k < nb; k++) {
        let y, tries = 0;
        do { y = r.range(270, 480); tries++; } while (usedY.some((u) => Math.abs(u - y) < 90) && tries < 12);
        let side = r.chance(0.5) ? 1 : -1;
        if ((side > 0 ? roomR : roomL) < 170) side = -side;
        const room = side > 0 ? roomR : roomL;
        if (room < 170) continue;
        usedY.push(y);
        brs.push({ side, y, len: Math.min(room, r.range(210, 330)), thick: r.range(24, 32), slope: r.range(-0.05, 0.025) });
      }
      slots.push(...F.tree(g, J.rng(r.seed()), p, x, base, w, brs).slots);
    }
    F.canopy(g, J.rng(r.seed()), p, W, dens);
    for (let i = 0, n = r.int(2, 4) + Math.round(dens * 3); i < n; i++) F.vine(g, J.rng(r.seed()), p, r.range(60, W - 60), r.range(90, 170), r.range(160, 400));
    for (let i = 0, n = Math.round(dens * 5); i < n; i++) F.drape(g, J.rng(r.seed()), p, r.range(40, W - 40), r.range(120, 180), r.range(60, 160));
    if (r.chance(0.7)) { const rw = r.range(90, 160); F.rock(g, J.rng(r.seed()), p, r.range(100, W - 100), groundY + r.range(40, 110), rw, rw * r.range(0.45, 0.6)); }
    if (r.chance(0.55)) F.log(g, J.rng(r.seed()), p, r.range(40, W - 360), groundY + r.range(50, 120), r.range(200, 300), r.range(16, 22));
    for (let i = 0, n = r.int(4, 7); i < n; i++) {
      F.bush(g, J.rng(r.seed()), r.range(30, W - 30), groundY + r.range(5, 40), r.range(120, 240), r.range(80, 130), p);
    }

    /* ================= satwa ================= */
    const animals = [], occ = [];
    const gMin = groundY + 60, gMax = H - 16;
    const depth = (y) => J.lerp(0.78, 1.05, J.clamp((y - gMin) / (gMax - gMin), 0, 1));
    const freeSlots = r.shuffle(slots.filter((s) => s.x1 - s.x0 > 130));
    const soft = stage >= 2;

    function tryPlace(sp, x, y, ignore) {
      const b = { x0: x + sp.box.x0, y0: y + sp.box.y0, x1: x + sp.box.x1, y1: y + sp.box.y1 };
      if (b.x0 < 16 || b.x1 > W - 16 || b.y0 < 112 || b.y1 > H - 4) return null;
      const area = J.boxArea(b);
      for (const o of occ) {
        if (o === ignore) continue;
        if (J.overlapArea(b, o) > 0.1 * Math.min(area, J.boxArea(o))) return null;
      }
      return b;
    }
    function mk(kind, extra, sp, x, y, b) {
      const it = Object.assign({ kind, sp, x, y, box: b, cx: (b.x0 + b.x1) / 2, cy: (b.y0 + b.y1) / 2, found: false, foundAt: 0 }, extra);
      it.eyes = sp.eyes.map((e) => ({ x: x + e.x, y: y + e.y }));
      it.head = sp.head ? { x: x + sp.head.x, y: y + sp.head.y, r: sp.head.r } : null;
      it.scale = sp.scale;
      return it;
    }
    function pickSlot(minLen) {
      const cand = freeSlots.filter((s) => !s.used && s.x1 - s.x0 >= minLen);
      return cand.length ? r.pick(cand) : null;
    }
    function placeLeopard(pose, variant) {
      for (let attempt = 0; attempt < 5; attempt++) {
        let y = 0, slot = null, ds = 0.94;
        if (pose === 'branch') {
          slot = pickSlot(190 * d.scale);
          if (!slot) return null;
        } else {
          const lo = gMin + (pose === 'peek' ? -10 : 0), hi = gMax - (pose === 'peek' ? 90 : 0);
          y = r.range(lo, hi); ds = depth(y);
        }
        const scale = d.scale * ds * r.range(0.93, 1.07);
        const sp = A.leopardSprite({ pose, variant, night, scale, R, flip: r.chance(0.5), soft });
        for (let k = 0; k < 14; k++) {
          let x;
          if (slot) {
            const half = 96 * scale;
            x = slot.x1 - slot.x0 > half * 2 ? r.range(slot.x0 + half, slot.x1 - half) : (slot.x0 + slot.x1) / 2;
            y = slot.y(x);
          } else x = r.range(40, W - 40);
          const b = tryPlace(sp, x, y);
          if (b) {
            occ.push(b);
            if (slot) slot.used = true;
            const it = mk('leopard', { pose, variant, cub: false }, sp, x, y, b);
            it.label = labelFor(it);
            return it;
          }
          if (slot) break;
        }
      }
      return null;
    }
    function placeCub(mom) {
      const pose = r.pick(['sit', 'walk']);
      const sp = A.leopardSprite({ pose, variant: mom.variant, night, scale: Math.max(0.24, mom.scale * 0.52), R, flip: r.chance(0.5), cub: true, soft });
      for (const side of r.shuffle([-1, 1])) {
        const x = mom.x + side * ((mom.box.x1 - mom.box.x0) * 0.5 + 30);
        const y = Math.min(gMax, mom.y + r.range(-4, 10));
        const b = tryPlace(sp, x, y, mom.box);
        if (b) {
          occ.push(b);
          const it = mk('leopard', { pose, variant: mom.variant, cub: true }, sp, x, y, b);
          it.label = labelFor(it);
          return it;
        }
      }
      return null;
    }

    const nLeo = r.int(d.count[0], d.count[1]);
    const poseW = { walk: 3, sit: 2.2, lie: 2.4, peek: 1.8, branch: 3.2 };
    let blackLeft = d.minBlack || 0, wantCub = !!d.cub && r.chance(d.cub);
    let placed = 0, guard = 0;
    while (placed < nLeo && guard < nLeo * 8) {
      guard++;
      const avail = Object.assign({}, poseW);
      if (!pickSlot(190 * d.scale)) delete avail.branch;
      const pose = r.weighted(avail);
      const blackSoFar = animals.filter((a) => a.variant === 'black').length;
      const black = blackLeft > 0 || (blackSoFar < Math.ceil(nLeo / 2) && r.chance(d.black || 0));
      const it = placeLeopard(pose, black ? 'black' : 'spotted');
      if (!it) { poseW[pose] *= 0.7; continue; }
      poseW[pose] *= 0.4;
      animals.push(it); placed++;
      if (black && blackLeft > 0) blackLeft--;
      if (wantCub && placed < nLeo && (pose === 'walk' || pose === 'sit' || pose === 'lie')) {
        const cub = placeCub(it);
        if (cub) { animals.push(cub); placed++; wantCub = false; }
      }
    }

    const dTypes = night ? ['kuwuk', 'kuwuk', 'kijang', 'landak']
      : stage === 0 ? ['kijang', 'ayam', 'landak', 'kuwuk']
        : ['kuwuk', 'kuwuk', 'kijang', 'kijang', 'ayam', 'landak', 'lutung', 'elang'];
    for (let i = 0; i < (d.decoys || 0); i++) {
      let type = r.pick(dTypes), slot = null;
      if (A.DECOY_ON_BRANCH[type]) { slot = pickSlot(60); if (!slot) type = 'kijang'; }
      for (let k = 0; k < 16; k++) {
        let x, y, ds = 0.94;
        if (slot) { x = r.range(slot.x0 + 30, slot.x1 - 30); y = slot.y(x); }
        else { y = r.range(gMin, gMax); ds = depth(y); x = r.range(40, W - 40); }
        const sp = A.animalSprite(type, { scale: d.scale * ds * r.range(0.93, 1.07), R, flip: r.chance(0.5), night, pose: r.chance(0.6) ? 'walk' : 'sit', soft });
        const b = tryPlace(sp, x, y);
        if (b) {
          occ.push(b);
          if (slot) slot.used = true;
          const it = mk('decoy', { type, variant: type }, sp, x, y, b);
          it.info = C.decoys[type];
          it.label = it.info.name;
          animals.push(it);
          break;
        }
      }
    }

    /* ================= tanaman berlapis ================= */
    const fr = J.rng(r.seed());
    const objs = [];
    const addV = (type, a, z, owner, essential) => {
      const v = { kind: 'veg', type, a, z, owner: owner || null, essential: !!essential, seed: fr.seed() };
      v.box = vegBox(type, a);
      objs.push(v);
      return v;
    };
    const gy = () => fr.range(groundY + 15, H - 10);
    // pohon & tanaman tinggi di tengah (bisa berdiri di depan satwa)
    for (let i = 0, n = Math.round(dens * 2 + fr()); i < n; i++) { const y = fr.range(groundY + 30, groundY + 170); addV('trunk', { x: fr.range(40, W - 40), y, w: fr.range(28, 48) }, y); }
    for (let i = 0, n = Math.round(dens * 5); i < n; i++) { const y = fr.range(groundY + 20, H - 80); addV('sapling', { x: fr.range(30, W - 30), y, top: y - fr.range(230, 380) }, y); }
    for (let i = 0, n = Math.round(dens * 3 + fr()); i < n; i++) { const y = fr.range(groundY + 20, H - 50); addV('treefern', { x: fr.range(40, W - 40), y, h: fr.range(110, 240), size: fr.range(90, 140) }, y); }
    // semak, pakis, rotan, rumput tinggi, daun lebar
    for (let i = 0, n = Math.round(4 + dens * 10); i < n; i++) { const y = gy(); addV('bush', { x: fr.range(20, W - 20), y, w: fr.range(90, 210), h: fr.range(60, 120), flowers: fr.chance(camo * 0.5) }, y); }
    for (let i = 0, n = Math.round(5 + dens * 11); i < n; i++) { const y = gy(); addV('fern', { x: fr.range(20, W - 20), y, size: fr.range(60, 130), dry: fr.chance(camo * 0.35) }, y); }
    for (let i = 0, n = Math.round(dens * 4); i < n; i++) { const y = gy(); addV('palm', { x: fr.range(30, W - 30), y, size: fr.range(120, 200), dry: fr.chance(camo * 0.25) }, y); }
    for (let i = 0, n = Math.round(3 + dens * 7); i < n; i++) { const y = gy(); addV('grass', { x: fr.range(20, W - 20), y, h: fr.range(60, 135), dry: fr.chance(camo * 0.35) }, y); }
    for (let i = 0, n = Math.round(dens * 4); i < n; i++) { const y = gy(); addV('spray', { x: fr.range(20, W - 20), y, size: fr.range(70, 120), dir: -Math.PI / 2 + fr.range(-0.7, 0.7), dry: fr.chance(camo * 0.2) }, y); }
    // daun di sekitar dahan (di depan satwa yang di dahan)
    for (const s of slots) {
      for (let k = 0, n = Math.round(dens * 2 + fr()); k < n; k++) {
        const x = fr.range(s.x0, s.x1);
        addV('foliage', { x, y: s.y(x) - fr.range(0, 30), rad: fr.range(30, 55) }, s.y(x) + 4);
      }
    }
    // tirai daun dari kanopi
    for (let i = 0, n = Math.round(dens * 3); i < n; i++) addV('drape', { x: fr.range(40, W - 40), y: fr.range(120, 170), len: fr.range(120, 300) }, 3000);

    // penutup khusus tiap satwa
    for (const it of animals) {
      const b = it.box, bw = b.x1 - b.x0, bh = b.y1 - b.y0;
      const isLeo = it.kind === 'leopard';
      const onBranch = it.pose === 'branch' || A.DECOY_ON_BRANCH[it.type];
      const z = it.y;
      let k = Math.round((d.occl || 0) * (isLeo ? 3.4 : 2.2) + fr.range(-0.45, 0.45));
      if (it.pose === 'peek') {
        addV('bush', { x: it.x, y: it.y + 92 * it.scale, w: 150 * it.scale + 40, h: 104 * it.scale + 12 }, z + 2, it, true);
        k = Math.max(0, k - 1);
      } else if (isLeo && onBranch && fr.chance(d.hide || 0)) {
        // badan tersembunyi di rimbun daun, kaki & ekor menjuntai
        const fx = it.x + (it.sp.head ? -it.sp.head.x * 0.25 : 0);
        addV('foliage', { x: fx, y: it.y - 26 * it.scale, rad: 70 * it.scale + 14 }, z + 3, it, true);
        k = Math.max(0, k - 1);
      } else if (isLeo && !onBranch && (it.pose === 'walk' || it.pose === 'sit' || it.pose === 'lie') && fr.chance(d.hide || 0)) {
        // bersembunyi di balik batang pohon
        addV('trunk', { x: it.cx + fr.range(-0.12, 0.12) * bw, y: it.y + fr.range(6, 26), w: J.clamp(bw * 0.28, 26, 56) }, z + 2, it, true);
        k = Math.max(0, k - 1);
      }
      for (let j = 0; j < k; j++) {
        let px = 0, py = 0;
        for (let t = 0; t < 10; t++) {
          px = fr.range(b.x0 + bw * 0.1, b.x1 - bw * 0.1);
          py = fr.range(b.y0 + bh * 0.25, b.y1);
          if (!it.head || Math.hypot(px - it.head.x, py - it.head.y) > it.head.r * (1.8 - (d.occl || 0))) break;
        }
        const zz = z + fr.range(1, 30);
        if (onBranch) {
          if (fr.chance(0.65)) addV('foliage', { x: px, y: py, rad: bh * fr.range(0.3, 0.42) }, zz, it);
          else addV('spray', { x: px, y: py, size: bh * 0.6, dir: fr.range(0, Math.PI * 2) }, zz, it);
        } else {
          const base = b.y1 + fr.range(4, 24), hh = Math.max(24, base - py);
          const tp = fr.pick(['fern', 'fern', 'bush', 'grass', 'spray', 'palm']);
          const dry = fr.chance(camo * 0.4);
          if (tp === 'fern') addV('fern', { x: px, y: base, size: hh * fr.range(1.0, 1.25), dry }, zz, it);
          else if (tp === 'bush') addV('bush', { x: px, y: base, w: bw * fr.range(0.35, 0.6), h: hh * fr.range(0.9, 1.1) }, zz, it);
          else if (tp === 'grass') addV('grass', { x: px, y: base, h: hh * 1.15, dry }, zz, it);
          else if (tp === 'palm') addV('palm', { x: px, y: base, size: hh * 1.1, dry }, zz, it);
          else addV('spray', { x: px, y: base, size: hh * 1.2, dir: -Math.PI / 2 + fr.range(-0.6, 0.6), dry }, zz, it);
        }
      }
    }
    // bingkai paling depan
    for (let x = -30; x < W + 40; x += fr.range(140, 230)) addV('fern', { x, y: H + 18, size: fr.range(100, 165) }, 5000);
    for (let i = 0, n = fr.int(5, 9); i < n; i++) addV('grass', { x: fr.range(0, W), y: H - fr.range(0, 30), h: fr.range(40, 80) }, 5000);
    addV('spray', { x: -10, y: fr.range(560, 820), size: fr.range(120, 170), dir: -0.3 }, 5000);
    addV('spray', { x: W + 10, y: fr.range(560, 820), size: fr.range(120, 170), dir: Math.PI + 0.3 }, 5000);
    for (let i = 0, n = fr.int(1, 3); i < n; i++) addV('vine', { x: fr.range(60, W - 60), y: -10, len: fr.range(140, 300) }, 5000);

    for (const it of animals) objs.push({ kind: 'animal', it, z: it.y, box: it.box });
    const order = () => objs.sort((a, b) => a.z - b.z);
    order();

    /* ================= jaminan terlihat & topeng bagian terlihat ================= */
    for (const it of animals) {
      const sp = it.sp, cw = sp.canvas.width, ch = sp.canvas.height;
      const lc = J.makeCanvas(cw, ch), lg = lc.getContext('2d', { willReadFrequently: true });
      const need = it.kind === 'leopard' ? d.minVis : d.minVis * 0.8;
      const md = sp.mask.data, n = cw * ch;
      let vm = null;
      for (let iter = 0; iter < 30; iter++) {
        const idx = objs.findIndex((o) => o.kind === 'animal' && o.it === it);
        const front = [];
        for (let i = idx + 1; i < objs.length; i++) if (J.overlapArea(objs[i].box, it.box) > 0) front.push(objs[i]);
        lg.setTransform(1, 0, 0, 1, 0, 0);
        lg.clearRect(0, 0, cw, ch);
        lg.setTransform(R, 0, 0, R, -(it.x + sp.ox) * R, -(it.y + sp.oy) * R);
        for (const o of front) drawObj(lg, o, p);
        const cov = lg.getImageData(0, 0, cw, ch).data;
        vm = new Uint8Array(n);
        let tot = 0, vis = 0;
        for (let i = 0; i < n; i++) {
          if (md[i * 4 + 3] < 100) continue;
          tot++;
          if (cov[i * 4 + 3] < 110) { vm[i] = 1; vis++; }
        }
        it.vis = tot ? vis / tot : 1;
        if (it.vis >= need) break;
        const byOverlap = (a, b) => J.overlapArea(b.box, it.box) - J.overlapArea(a.box, it.box);
        let cands = front.filter((o) => o.kind === 'veg' && !o.essential).sort(byOverlap);
        // persembunyian khusus boleh dilepas hanya jika macan tutul hampir tak terlihat
        if (!cands.length && it.vis < need * 0.7) cands = front.filter((o) => o.kind === 'veg').sort(byOverlap);
        if (!cands.length) break;
        const drop = it.vis < need * 0.5 ? 2 : 1;
        for (const c of cands.slice(0, drop)) objs.splice(objs.indexOf(c), 1);
      }
      it.vmask = vm;
      // mata hanya menyala jika tidak tertutup
      it.eyesVis = it.eyes.filter((e) => {
        const ex = Math.round((e.x - it.x - sp.ox) * R), ey = Math.round((e.y - it.y - sp.oy) * R);
        for (let dy = -3; dy <= 3; dy += 3) for (let dx = -3; dx <= 3; dx += 3) {
          const x = ex + dx, y = ey + dy;
          if (x >= 0 && y >= 0 && x < cw && y < ch && vm[y * cw + x]) return true;
        }
        return false;
      });
    }

    /* ================= gabungkan menjadi satu gambar ================= */
    const comp = J.makeCanvas(W * R, H * R);
    const cg = comp.getContext('2d', { willReadFrequently: night });
    cg.setTransform(R, 0, 0, R, 0, 0);
    cg.drawImage(bg, 0, 0, W, H);
    for (const o of objs) drawObj(cg, o, p);
    F.dapple(cg, J.rng(r.seed()), W, H, d.light || 0, groundY, night);
    if (mode === 'pagi') { cg.fillStyle = 'rgba(240,250,240,0.08)'; cg.fillRect(0, 0, W, H); }
    if (mode === 'senja') {
      cg.save(); cg.globalCompositeOperation = 'multiply';
      cg.fillStyle = 'rgba(240,160,105,0.5)'; cg.fillRect(0, 0, W, H);
      cg.restore();
    }
    if (night) {
      A.toIR(comp, { falloff: true, gain: 0.95, foliage: 0.72, cx: 0.5, cy: 0.86, rad: 0.62, noise: 12 });
      const diag = Math.hypot(W, H) * 0.62;
      for (const it of animals) { // versi untuk sorotan saat ditemukan
        const dist = Math.hypot(it.cx - W * 0.5, it.cy - H * 0.86) / diag;
        A.toIR(it.sp.canvas, { level: J.clamp(1.28 - dist * 1.1, 0.4, 1.06), gain: 1.12, noise: 8 });
      }
    }

    animals.sort((a, b) => a.y - b.y);
    return {
      seed, stage, diff: d, mode, night, comp, items: animals, R,
      leopards: animals.filter((i) => i.kind === 'leopard'),
      genMs: Math.round(performance.now() - t0)
    };
  }

  /* Hanya bagian tubuh yang terlihat yang bisa diklik. */
  function visHit(it, lx, ly, tol) {
    const sp = it.sp, R = sp.R, m = sp.mask, mw = m.width, mh = m.height, vm = it.vmask;
    const px = (lx - it.x - sp.ox) * R, py = (ly - it.y - sp.oy) * R;
    const test = (x, y) => {
      x = Math.round(x); y = Math.round(y);
      if (x < 0 || y < 0 || x >= mw || y >= mh) return false;
      return vm ? vm[y * mw + x] === 1 : m.data[(y * mw + x) * 4 + 3] > 60;
    };
    if (test(px, py)) return true;
    if (tol > 0) {
      for (const f of [0.5, 1]) for (let k = 0; k < 12; k++) {
        const a = (k / 12) * Math.PI * 2;
        if (test(px + Math.cos(a) * tol * R * f, py + Math.sin(a) * tol * R * f)) return true;
      }
    }
    return false;
  }

  /* Cari satwa di titik (lx, ly). Prioritas: kena tepat > macan tutul dalam toleransi > pengecoh. */
  S.hit = function (scene, lx, ly, tol) {
    const list = scene.items.slice().sort((a, b) => b.y - a.y);
    const inBox = (it, t) => lx >= it.box.x0 - t && lx <= it.box.x1 + t && ly >= it.box.y0 - t && ly <= it.box.y1 + t;
    for (const it of list) if (inBox(it, 0) && visHit(it, lx, ly, 0)) return it;
    for (const kind of ['leopard', 'decoy']) {
      for (const it of list) {
        if (it.kind === kind && inBox(it, tol) && visHit(it, lx, ly, tol)) return it;
      }
    }
    return null;
  };
})();

/* Papan skor lokal (satu perangkat), disimpan di localStorage. */
(function () {
  'use strict';
  const J = window.JSMT;
  const KEY = 'jsmt.leaderboard.v1';
  let memory = []; // cadangan jika localStorage tidak tersedia

  function dayKey(d) {
    d = d || new Date();
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function cmp(a, b) { return b.score - a.score || (a.mistakes || 0) - (b.mistakes || 0) || a.ts - b.ts; }

  const LB = (J.Leaderboard = {
    dayKey,
    load() {
      try {
        const raw = localStorage.getItem(KEY);
        const a = raw ? JSON.parse(raw) : [];
        return Array.isArray(a) ? a : [];
      } catch (e) { return memory.slice(); }
    },
    saveAll(a) {
      const trimmed = a.slice(-5000);
      memory = trimmed;
      try { localStorage.setItem(KEY, JSON.stringify(trimmed)); } catch (e) { /* abaikan */ }
    },
    add(entry) {
      const a = LB.load();
      const e = Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), ts: Date.now(), day: dayKey() }, entry);
      a.push(e);
      LB.saveAll(a);
      return e;
    },
    sorted(scope) {
      let a = LB.load();
      if (scope === 'today') { const k = dayKey(); a = a.filter((e) => e.day === k); }
      return a.sort(cmp);
    },
    top(scope, n) { return LB.sorted(scope).slice(0, n); },
    rank(scope, id) { const i = LB.sorted(scope).findIndex((e) => e.id === id); return i < 0 ? null : i + 1; },
    /* Peringkat yang akan didapat jika skor ini disimpan sekarang. */
    wouldRank(scope, score, mistakes) {
      const probe = { score, mistakes, ts: Date.now() };
      return LB.sorted(scope).filter((e) => cmp(e, probe) < 0).length + 1;
    },
    resetToday() { const k = dayKey(); LB.saveAll(LB.load().filter((e) => e.day !== k)); },
    resetAll() { LB.saveAll([]); },
    /* Cadangan data untuk dipindah ke PC lain. */
    backup(settings) {
      return { app: 'jejak-si-macan-tutul', format: 1, exportedAt: new Date().toISOString(), settings: settings || null, leaderboard: LB.load() };
    },
    /* Gabungkan skor dari file cadangan (skor yang sudah ada tidak digandakan). */
    importBackup(data) {
      const list = Array.isArray(data) ? data : data && Array.isArray(data.leaderboard) ? data.leaderboard : null;
      if (!list || (data && data.app && data.app !== 'jejak-si-macan-tutul')) throw new Error('format');
      const cur = LB.load();
      const seen = new Set(cur.map((e) => e.id || e.ts + '|' + e.name));
      let added = 0, skipped = 0;
      for (const raw of list) {
        if (!raw || typeof raw !== 'object') { skipped++; continue; }
        const score = Math.floor(Number(raw.score));
        const ts = Number(raw.ts) || Date.now();
        if (!isFinite(score) || score < 0 || score > 100000) { skipped++; continue; }
        const e = {
          id: typeof raw.id === 'string' && raw.id ? raw.id.slice(0, 40) : ts.toString(36) + Math.random().toString(36).slice(2, 7),
          ts,
          day: typeof raw.day === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(raw.day) ? raw.day : dayKey(new Date(ts)),
          name: String(raw.name || '').slice(0, 20) || 'Penjelajah',
          score,
          stages: Math.max(0, Math.floor(Number(raw.stages) || 0)),
          mistakes: Math.max(0, Math.floor(Number(raw.mistakes) || 0))
        };
        const key = e.id;
        if (seen.has(key) || seen.has(e.ts + '|' + e.name)) { skipped++; continue; }
        seen.add(key);
        cur.push(e);
        added++;
      }
      cur.sort((a, b) => a.ts - b.ts);
      LB.saveAll(cur);
      return { added, skipped };
    },
    csv() {
      const rows = [['tanggal', 'waktu', 'nama', 'skor', 'stasiun_bersih', 'salah_pilih']];
      for (const e of LB.load().sort((a, b) => a.ts - b.ts)) {
        const d = new Date(e.ts);
        rows.push([e.day, d.toLocaleTimeString('id-ID'), e.name, e.score, e.stages || 0, e.mistakes || 0]);
      }
      return rows.map((r) => r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    }
  });
})();

/* Lapisan antarmuka (DOM): layar, HUD, papan skor, keyboard nama, gelembung info. */
(function () {
  'use strict';
  const J = window.JSMT, C = window.JSMT_CONTENT, CFG = window.JSMT_CONFIG;
  const $ = (id) => document.getElementById(id);
  const UI = (J.UI = {});

  const get = (path) => path.split('.').reduce((o, k) => (o ? o[k] : undefined), C);
  UI.t = (path, vars) => J.tpl(get(path) || '', vars);

  UI.init = function () {
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = UI.t(el.getAttribute('data-t')); });
    document.title = C.title;
    const tl = C.titleLines || [C.title];
    $('attract-title').innerHTML = '<span>' + esc(tl[0]) + '</span>' + (tl[1] ? '<span class="line2">' + esc(tl[1]) + '</span>' : '');
    UI.buildKeyboard();
    UI.buildPinpad();
  };

  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  UI.esc = esc;

  /* ---------- layar ---------- */
  const screens = ['screen-attract', 'screen-briefing', 'overlay-fact', 'screen-result', 'screen-board', 'overlay-admin'];
  UI.show = function (id) {
    for (const s of screens) { if (s !== 'overlay-admin') $(s).classList.toggle('active', s === id); }
  };
  UI.overlay = function (id, on) { $(id).classList.toggle('active', !!on); };
  UI.isOpen = (id) => $(id).classList.contains('active');

  /* ---------- briefing ---------- */
  UI.buildRules = function (icons) {
    const box = $('rules');
    box.innerHTML = '';
    for (const r of C.ui.rules) {
      const d = document.createElement('div');
      d.className = 'rule';
      d.innerHTML = (icons[r.icon] ? '<img alt="" src="' + icons[r.icon] + '">' : '') + '<b>' + esc(r.title) + '</b><span>' + esc(r.text) + '</span>';
      box.appendChild(d);
    }
  };

  /* ---------- HUD ---------- */
  UI.hud = {
    show(on) { $('hud').classList.toggle('hidden', !on); },
    score(v, bump) {
      $('hud-score').textContent = v;
      if (bump) { const el = document.querySelector('.hud-score'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    },
    time(left, total) {
      $('hud-time').textContent = J.fmtTime(left);
      $('hud-timebar').style.width = J.clamp((left / total) * 100, 0, 100) + '%';
      document.querySelector('.hud-time').classList.toggle('low', left <= 10);
    },
    station(n, mode) {
      $('hud-station').textContent = UI.t('ui.station', { n });
      $('hud-mode').textContent = C.ui.modes[mode] || '';
      $('hud').classList.toggle('night', mode === 'malam');
    },
    pips(leopards) {
      const box = $('hud-pips');
      if (box.children.length !== leopards.length) {
        box.innerHTML = '';
        for (let i = 0; i < leopards.length; i++) { const s = document.createElement('span'); s.className = 'pip'; box.appendChild(s); }
      }
      const found = leopards.filter((l) => l.found);
      [...box.children].forEach((el, i) => {
        const l = found[i];
        el.className = 'pip' + (l ? ' done' + (l.variant === 'black' ? ' black' : '') : '');
      });
    }
  };

  /* ---------- banner & gelembung ---------- */
  let bannerTimer = null;
  UI.banner = function (html, cls) {
    const b = $('banner');
    b.className = 'banner';
    b.innerHTML = html;
    void b.offsetWidth;
    b.className = 'banner show' + (cls ? ' ' + cls : '');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => { b.className = 'banner'; }, 1700);
  };
  UI.bubble = function (lx, ly, title, text, extra) {
    const box = $('bubbles');
    while (box.children.length > 1) box.removeChild(box.firstChild);
    const d = document.createElement('div');
    d.className = 'bubble' + (ly < 300 ? ' below' : '');
    d.style.left = J.clamp((lx / J.W) * 100, 15, 85) + '%';
    d.style.top = (ly / J.H) * 100 + '%';
    d.innerHTML = '<b>' + esc(title) + '</b><span>' + esc(text) + (extra ? ' <em>' + esc(extra) + '</em>' : '') + '</span>';
    box.appendChild(d);
    setTimeout(() => d.classList.add('fade'), 3200);
    setTimeout(() => d.remove(), 3700);
  };
  UI.clearBubbles = () => { $('bubbles').innerHTML = ''; };

  /* ---------- kartu fakta ---------- */
  let factTimer = null, factRAF = null;
  UI.showFact = function (fact, onNext) {
    $('fact-title').textContent = fact.title;
    $('fact-text').textContent = fact.text;
    UI.overlay('overlay-fact', true);
    const t0 = performance.now(), dur = CFG.factAutoSec * 1000;
    const bar = $('fact-progress');
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(factTimer); cancelAnimationFrame(factRAF);
      UI.overlay('overlay-fact', false);
      $('btn-fact-next').onclick = null;
      onNext();
    };
    const step = () => { bar.style.width = J.clamp(((performance.now() - t0) / dur) * 100, 0, 100) + '%'; factRAF = requestAnimationFrame(step); };
    step();
    factTimer = setTimeout(finish, dur);
    $('btn-fact-next').onclick = (e) => { e.stopPropagation(); J.Audio.click(); finish(); };
  };
  UI.cancelFact = function () { clearTimeout(factTimer); cancelAnimationFrame(factRAF); UI.overlay('overlay-fact', false); };

  /* ---------- layar awal ---------- */
  let factIdx = 0, factInt = null;
  UI.startAttractFacts = function () {
    const facts = J.rng(J.randomSeed()).shuffle(C.facts.slice());
    const put = () => {
      const card = document.querySelector('.fact-card-mini');
      card.classList.add('swap');
      setTimeout(() => {
        const f = facts[factIdx++ % facts.length];
        $('attract-fact-title').textContent = f.title;
        $('attract-fact-text').textContent = f.text;
        card.classList.remove('swap');
      }, 350);
    };
    clearInterval(factInt);
    put();
    factInt = setInterval(put, CFG.attractFactSec * 1000);
  };
  UI.stopAttractFacts = () => clearInterval(factInt);

  function listHTML(entries, highlightId, n) {
    if (!entries.length) return '<li class="empty">' + esc(C.ui.empty) + '</li>';
    let html = '';
    entries.slice(0, n).forEach((e, i) => {
      html += '<li' + (e.id === highlightId ? ' class="me"' : '') + '><span class="n">' + (i + 1) + '</span><span class="nm">' + esc(e.name) + '</span><span class="sc">' + e.score + '</span></li>';
    });
    return html;
  }
  UI.renderMiniBoard = function () {
    const top = J.Leaderboard.top('today', 5);
    $('attract-top').innerHTML = top.length ? listHTML(top, null, 5) : '<li class="empty">' + esc(C.ui.noScores) + '</li>';
  };
  UI.renderBoards = function (highlightId) {
    const today = J.Leaderboard.sorted('today'), all = J.Leaderboard.sorted('all');
    const fit = (list) => {
      const top = list.slice(0, 10);
      if (highlightId && !top.some((e) => e.id === highlightId)) {
        const i = list.findIndex((e) => e.id === highlightId);
        if (i >= 0) return { top: top.slice(0, 9), extra: { e: list[i], rank: i + 1 } };
      }
      return { top, extra: null };
    };
    for (const [id, list] of [['board-today', today], ['board-all', all]]) {
      const f = fit(list);
      let html = listHTML(f.top, highlightId, 10);
      if (f.extra) html += '<li class="me"><span class="n">' + f.extra.rank + '</span><span class="nm">' + esc(f.extra.e.name) + '</span><span class="sc">' + f.extra.e.score + '</span></li>';

  };

  /* ---------- hasil & nama ---------- */
  let nameBuf = '';
  UI.setName = function (s) {
    nameBuf = s.slice(0, CFG.nameMaxLen);
    $('name-text').textContent = nameBuf;
  };
  UI.getName = () => nameBuf;
  UI.typeKey = function (k) {
    if (k === 'DEL') UI.setName(nameBuf.slice(0, -1));
    else if (k === 'SPACE') { if (nameBuf && !nameBuf.endsWith(' ')) UI.setName(nameBuf + ' '); }
    else if (/^[A-Za-z0-9]$/.test(k)) UI.setName(nameBuf + k.toUpperCase());
  };
  UI.buildKeyboard = function () {
    const rows = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
    const kb = $('keyboard');
    kb.innerHTML = '';
    rows.forEach((row, ri) => {
      const r = document.createElement('div');
      r.className = 'kb-row';
      for (const ch of row) r.appendChild(keyBtn(ch, ch));
      if (ri === 2) r.appendChild(keyBtn(C.ui.del, 'DEL', 'mid'));
      kb.appendChild(r);
    });
    const r = document.createElement('div');
    r.className = 'kb-row';
    r.appendChild(keyBtn(C.ui.space, 'SPACE', 'wide'));
    kb.appendChild(r);
    function keyBtn(label, code, cls) {
      const b = document.createElement('button');
      b.className = 'key' + (cls ? ' ' + cls : '');
      b.textContent = label;
      b.addEventListener('pointerdown', (e) => { e.preventDefault(); J.Audio.click(); UI.typeKey(code); });
      return b;
    }
  };
  UI.cleanName = function (raw) {
    const name = (raw || '').trim().replace(/\s+/g, ' ');
    if (!name) return C.ui.defaultName;
    const low = name.toLowerCase(), squashed = low.replace(/[^a-z]/g, '');
    const words = low.split(/[^a-z]+/);
    for (const w of C.blockedWords) {
      if (w.length <= 4 ? words.includes(w) : squashed.includes(w)) return C.ui.defaultName;
    }
    return name;
  };

  /* ---------- PIN admin ---------- */
  let pinBuf = '', pinCb = null;
  UI.buildPinpad = function () {
    const pad = $('pinpad');
    pad.innerHTML = '';
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'DEL', '0', 'OK'];
    for (const k of keys) {
      const b = document.createElement('button');
      b.className = 'key';
      b.textContent = k === 'DEL' ? '⌫' : k === 'OK' ? '✓' : k;
      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (k === 'DEL') pinBuf = pinBuf.slice(0, -1);
        else if (k === 'OK') { if (pinCb) pinCb(pinBuf); return; }
        else if (pinBuf.length < 8) pinBuf += k;
        renderPin();
      });
      pad.appendChild(b);
    }
  };
  function renderPin(err) {
    const d = $('pin-display');
    d.classList.toggle('err', !!err);
    d.textContent = err ? C.ui.adminWrong : '•'.repeat(pinBuf.length);
  }
  UI.askPin = function (cb) { pinBuf = ''; pinCb = cb; renderPin(); };
  UI.pinError = function () { pinBuf = ''; renderPin(true); };
})();
