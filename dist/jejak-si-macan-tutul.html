/* Logika permainan: timer, skor, tap, petunjuk, efek, pergantian stasiun. */
(function () {
  'use strict';
  const J = window.JSMT, A = J.Art, CFG = window.JSMT_CONFIG, C = window.JSMT_CONTENT;
  const W = J.W, H = J.H, TAU = Math.PI * 2;
  const UI = () => J.UI;

  /* ---------- gambar adegan (dipakai juga oleh layar awal) ---------- */
  J.drawScene = function (ctx, sc, now, opt) {
    opt = opt || {};
    ctx.drawImage(sc.comp, 0, 0, W, H);
    if (sc.night) { // mata memantulkan cahaya kamera inframerah
      for (const it of sc.items) {
        const eyes = it.eyesVis || it.eyes;
        if (it.found || !eyes.length) continue;
        const blink = Math.sin(now * 1.3 + it.x * 0.01) > 0.965 ? 0.15 : 1;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const e of eyes) {
          const rad = Math.max(3.5, 6 * it.scale);
          const gr = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, rad * 3.6);
          gr.addColorStop(0, 'rgba(255,255,255,' + blink + ')');
          gr.addColorStop(0.25, 'rgba(230,250,255,' + 0.75 * blink + ')');
          gr.addColorStop(1, 'rgba(200,235,255,0)');
          ctx.fillStyle = gr;
          ctx.beginPath(); ctx.arc(e.x, e.y, rad * 3.6, 0, TAU); ctx.fill();
        }
        ctx.restore();
        for (const e of eyes) {
          ctx.fillStyle = 'rgba(255,255,255,' + blink + ')';
          ctx.beginPath(); ctx.arc(e.x, e.y, Math.max(2.2, 3.4 * it.scale), 0, TAU); ctx.fill();
        }
      }
    }
    if (opt.found !== false) {
      for (const it of sc.items) {
        if (!it.found && !it.missed && !it.demo) continue;
        const a = it.demo ? it.demo : J.clamp((now - it.foundAt) / 0.25, 0, 1);
        ctx.globalAlpha = a;
        const glow = A.glow(it.sp, it.missed ? '#ffffff' : '#ffe15a');
        ctx.drawImage(glow, it.x + it.sp.ox, it.y + it.sp.oy, it.sp.lw, it.sp.lh);
        ctx.globalAlpha = 1;
        J.drawBracket(ctx, it, it.missed ? '#ff6b5b' : '#ffd84a', it.missed ? C.ui.missed + ' · ' + it.label : it.label, a);
      }
    }
  };

  J.drawBracket = function (ctx, it, color, label, alpha) {
    const pad = 8, b = it.box;
    const x0 = b.x0 - pad, y0 = b.y0 - pad, x1 = b.x1 + pad, y1 = b.y1 + pad;
    const L = Math.min(28, (x1 - x0) / 3, (y1 - y0) / 3);
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const corners = () => {
      ctx.beginPath();
      ctx.moveTo(x0, y0 + L); ctx.lineTo(x0, y0); ctx.lineTo(x0 + L, y0);
      ctx.moveTo(x1 - L, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y0 + L);
      ctx.moveTo(x1, y1 - L); ctx.lineTo(x1, y1); ctx.lineTo(x1 - L, y1);
      ctx.moveTo(x0 + L, y1); ctx.lineTo(x0, y1); ctx.lineTo(x0, y1 - L);
      ctx.stroke();
    };
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 8; corners();
    ctx.strokeStyle = color; ctx.lineWidth = 4.5; corners();
    if (label) {
      ctx.font = '800 19px ' + getComputedStyle(document.body).fontFamily;
      const tw = ctx.measureText(label).width + 20, th = 30;
      let lx = J.clamp((x0 + x1) / 2 - tw / 2, 8, W - tw - 8);
      let ly = y0 - th - 6;
      if (ly < 108) ly = y1 + 6;
      if (ly + th > H - 4) ly = y0 + 6;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      roundRect(ctx, lx + 2, ly + 3, tw, th, 10); ctx.fill();
      ctx.fillStyle = color;
      roundRect(ctx, lx, ly, tw, th, 10); ctx.fill();
      ctx.fillStyle = '#2a1a06';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, lx + 10, ly + th / 2 + 1);
    }
    ctx.restore();
  };
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  /* ---------- kelas permainan ---------- */
  class Game {
    constructor(opts) {
      this.onEnd = opts.onEnd;
      this.active = false;
      this.scene = null;
    }

    buildFactQueue() {
      const rr = J.rng(J.randomSeed());
      const byId = {};
      C.facts.forEach((f) => { byId[f.id] = f; });
      const pri = (C.priorityFacts || []).map((id) => byId[id]).filter(Boolean);
      const rest = rr.shuffle(C.facts.filter((f) => !pri.includes(f) && !(C.nightFacts || []).includes(f.id)));
      this.facts = pri.concat(rest);
      this.nightFacts = (C.nightFacts || []).map((id) => byId[id]).filter(Boolean);
    }
    nextFact(wasNight) {
      if (wasNight && this.nightFacts.length) return this.nightFacts.shift();
      const f = this.facts.shift() || C.facts[Math.floor(Math.random() * C.facts.length)];
      this.facts.push(f);
      return f;
    }

    start(duration) {
      this.duration = duration;
      this.timeLeft = duration;
      this.score = 0; this.stage = 0; this.stagesCleared = 0; this.mistakes = 0;
      this.effects = []; this.particles = [];
      this.paused = false; this.ending = false; this.active = true;
      this.misses = []; this.lockUntil = 0; this.lastTickSec = null;
      this.buildFactQueue();
      this.loadScene(J.Scene.generate(0, { R: J.R }));
      this.addShutter(null, true);
      UI().hud.show(true);
      UI().hud.score(0);
      UI().hud.time(this.timeLeft, this.duration);
      J.Audio.start();
    }

    loadScene(sc) {
      this.scene = sc;
      const now = J.now();
      this.stageStart = now; this.lastFind = now; this.hintTarget = null; this.nextScene = null;
      UI().hud.station(this.stage + 1, sc.mode);
      UI().hud.pips(sc.leopards);
      UI().clearBubbles();
      if (sc.night) setTimeout(() => this.active && UI().banner(UI().esc(C.ui.nightTip), 'calm'), 450);
    }

    stop() { this.active = false; UI().hud.show(false); UI().clearBubbles(); UI().cancelFact(); }

    /* ---------- input ---------- */
    pointer(lx, ly, tol) {
      if (!this.active || this.paused || this.ending) return;
      const now = J.now();
      if (now < this.lockUntil) return;
      const it = J.Scene.hit(this.scene, lx, ly, tol);
      if (it && it.kind === 'leopard') {
        if (it.found) return;
        it.found = true; it.foundAt = now;
        this.score++;
        this.lastFind = now; this.hintTarget = null;
        this.effects.push({ type: 'ring', x: it.cx, y: it.cy, r0: 20, r1: Math.max(90, (it.box.x1 - it.box.x0) * 0.7), t0: now, dur: 0.6 });
        this.effects.push({ type: 'text', x: it.cx, y: it.box.y0 - 10, text: '+1', t0: now, dur: 0.9, color: '#ffe15a' });
        this.effects.push({ type: 'flash', t0: now, dur: 0.22 });
        J.Audio.found();
        UI().hud.score(this.score, true);
        UI().hud.pips(this.scene.leopards);
        if (this.scene.leopards.every((l) => l.found)) this.stageClear();
        return;
      }
      if (it && it.kind === 'decoy') {
        let extra = '';
        if (!it.penalized) {
          it.penalized = true;
          this.mistakes++;
          this.timeLeft = Math.max(0, this.timeLeft - CFG.decoyPenaltySec);
          extra = J.tpl(C.ui.penalty, { s: CFG.decoyPenaltySec });
          this.effects.push({ type: 'text', x: it.cx, y: it.box.y0 - 6, text: extra, t0: now, dur: 1.1, color: '#ff8a70' });
        }
        this.effects.push({ type: 'xbox', it, t0: now, dur: 1.2 });
        J.Audio.decoy();
        UI().bubble(it.cx, it.box.y0, it.info.name, it.info.text, extra);
        return;
      }
      // meleset
      this.effects.push({ type: 'miss', x: lx, y: ly, t0: now, dur: 0.4 });
      J.Audio.miss();
      this.misses = this.misses.filter((t) => now - t < CFG.spamWindowSec);
      this.misses.push(now);
      if (this.misses.length >= CFG.spamMisses) {
        this.misses = [];
        this.lockUntil = now + CFG.spamLockSec;
        UI().banner(UI().esc(C.ui.calm), 'calm');
      }
    }

    stageClear() {
      this.paused = true;
      UI().clearBubbles();
      this.stagesCleared++;
      this.timeLeft += CFG.clearBonusSec;
      UI().hud.time(this.timeLeft, this.duration);
      J.Audio.clear();
      UI().banner(UI().esc(C.ui.cleared) + '<small>' + UI().esc(J.tpl(C.ui.bonus, { s: CFG.clearBonusSec })) + '</small>');
      const wasNight = this.scene.night;
      const nextStage = this.stage + 1;
      setTimeout(() => { // buat stasiun berikutnya selagi pemain membaca fakta
        if (!this.active) return;
        try { this.nextScene = J.Scene.generate(nextStage, { R: J.R }); } catch (e) { console.error(e); }
      }, 120);
      setTimeout(() => {
        if (!this.active) return;
        UI().showFact(this.nextFact(wasNight), () => {
          if (!this.active) return;
          this.stage = nextStage;
          const sc = this.nextScene || J.Scene.generate(nextStage, { R: J.R });
          this.addShutter(() => { this.loadScene(sc); }, false, () => { this.paused = false; this.lastFind = J.now(); });
        });
      }, 1150);
    }

    addShutter(onMid, openOnly, onEnd) {
      this.effects.push({ type: 'shutter', t0: J.now(), dur: openOnly ? 0.35 : 0.6, openOnly, onMid, onEnd, midDone: false });
    }

    end() {
      this.ending = true;
      this.paused = true;
      J.Audio.over();
      UI().banner(UI().esc(C.ui.timeUp));
      for (const l of this.scene.leopards) if (!l.found) l.missed = true;
      setTimeout(() => {
        if (!this.active) return;
        this.active = false;
        UI().hud.show(false);
        this.onEnd({ score: this.score, stages: this.stagesCleared, mistakes: this.mistakes });
      }, 2600);
    }

    /* ---------- update & render ---------- */
    update(dt, now) {
      if (!this.active) return;
      if (!this.paused && !this.ending) {
        this.timeLeft -= dt;
        const sec = Math.ceil(this.timeLeft);
        if (sec !== this.lastTickSec) {
          this.lastTickSec = sec;
          UI().hud.time(this.timeLeft, this.duration);
          if (sec <= 5 && sec > 0) J.Audio.tick();
        }
        if (this.timeLeft <= 0) { this.timeLeft = 0; UI().hud.time(0, this.duration); this.end(); }
        // petunjuk
        const idle = now - this.lastFind;
        if (idle > CFG.hintAfterSec) {
          if (!this.hintTarget || this.hintTarget.found) {
            const left = this.scene.leopards.filter((l) => !l.found);
            this.hintTarget = left[Math.floor(Math.random() * left.length)] || null;
            this.hintPulseOff = { x: (Math.random() - 0.5) * 60, y: (Math.random() - 0.5) * 40 };
          }
          if (this.hintTarget && Math.random() < dt * 2.2) this.spawnLeaf(this.hintTarget, now);
        }
      }
      for (const p of this.particles) {
        p.vy += 26 * dt; p.x += (p.vx + Math.sin(now * 3 + p.ph) * 22) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      }
      this.particles = this.particles.filter((p) => now - p.t0 < p.life);
    }

    spawnLeaf(it, now) {
      const b = it.box;
      this.particles.push({
        x: J.lerp(b.x0, b.x1, Math.random()), y: b.y0 - 10 + Math.random() * 20, vx: (Math.random() - 0.5) * 20, vy: 10,
        rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 6, ph: Math.random() * TAU, t0: now, life: 1.8,
        col: Math.random() < 0.5 ? '#6fb552' : '#c9a646', s: 7 + Math.random() * 5
      });
    }

    render(ctx, now) {
      if (!this.scene) return;
      J.drawScene(ctx, this.scene, now);
      // lingkaran petunjuk kuat
      if (this.active && !this.paused && this.hintTarget && now - this.lastFind > CFG.strongHintAfterSec) {
        const it = this.hintTarget, k = (Math.sin(now * 3) + 1) / 2;
        const rad = Math.max(it.box.x1 - it.box.x0, it.box.y1 - it.box.y0) * 0.75 + 30;
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.25 + 0.35 * k) + ')';
        ctx.lineWidth = 5; ctx.setLineDash([14, 12]); ctx.lineDashOffset = -now * 30;
        ctx.beginPath(); ctx.arc(it.cx + this.hintPulseOff.x, it.cy + this.hintPulseOff.y, rad + k * 10, 0, TAU); ctx.stroke();
        ctx.restore();
      }
      for (const p of this.particles) {
        const a = 1 - (now - p.t0) / p.life;
        ctx.save(); ctx.globalAlpha = J.clamp(a * 1.5, 0, 1); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.col; ctx.strokeStyle = '#22331a'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.45, 0, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      const keep = [];
      for (const e of this.effects) {
        const t = (now - e.t0) / e.dur;
        if (t >= 1) { if (e.type === 'shutter') { if (e.onMid && !e.midDone) e.onMid(); if (e.onEnd) e.onEnd(); } continue; }
        keep.push(e);
        this.drawEffect(ctx, e, t, now);
      }
      this.effects = keep;
    }

    drawEffect(ctx, e, t, now) {
      if (e.type === 'ring') {
        const k = J.ease.outCubic(t);
        ctx.save(); ctx.strokeStyle = 'rgba(255,225,90,' + (1 - t) + ')'; ctx.lineWidth = 8 * (1 - t) + 2;
        ctx.beginPath(); ctx.arc(e.x, e.y, J.lerp(e.r0, e.r1, k), 0, TAU); ctx.stroke(); ctx.restore();
      } else if (e.type === 'text') {
        const k = J.ease.outCubic(t);
        ctx.save(); ctx.globalAlpha = 1 - t * t;
        ctx.font = '900 46px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'center';
        ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(40,20,0,0.85)';
        const y = Math.max(130, e.y - k * 50);
        ctx.strokeText(e.text, e.x, y); ctx.fillStyle = e.color; ctx.fillText(e.text, e.x, y);
        ctx.restore();
      } else if (e.type === 'flash') {
        ctx.fillStyle = 'rgba(255,255,255,' + 0.35 * (1 - t) + ')'; ctx.fillRect(0, 0, W, H);
      } else if (e.type === 'miss') {
        ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,' + 0.8 * (1 - t) + ')'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(e.x, e.y, 8 + t * 22, 0, TAU); ctx.stroke(); ctx.restore();
      } else if (e.type === 'xbox') {
        J.drawBracket(ctx, e.it, '#ff8a70', null, 1 - t);
      } else if (e.type === 'shutter') {
        let close;
        if (e.openOnly) close = 1 - J.ease.inOut(t);
        else if (t < 0.5) close = J.ease.inOut(t * 2);
        else { if (!e.midDone) { e.midDone = true; if (e.onMid) e.onMid(); } close = 1 - J.ease.inOut((t - 0.5) * 2); }
        const hgt = (H / 2) * close;
        ctx.fillStyle = '#060d08';
        ctx.fillRect(0, 0, W, hgt); ctx.fillRect(0, H - hgt, W, hgt);
        if (close > 0.05) {
          ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(0, hgt); ctx.lineTo(W, hgt); ctx.moveTo(0, H - hgt); ctx.lineTo(W, H - hgt); ctx.stroke();
        }
      }
    }
  }
  J.Game = Game;
})();

/* Titik masuk: ukuran layar, loop gambar, alur layar, mode kiosk, panel admin. */
(function () {
  'use strict';
  const J = window.JSMT, A = J.Art, CFG = window.JSMT_CONFIG, C = window.JSMT_CONTENT, UI = J.UI;
  const W = J.W, H = J.H;
  const $ = (id) => document.getElementById(id);
  const SETTINGS_KEY = 'jsmt.settings.v1';

  const stage = $('stage'), canvas = $('game'), ctx = canvas.getContext('2d');
  let state = 'boot', lastInput = J.now(), lastFrame = 0, vignette = null, vignR = 0;
  let pendingResult = null, lastEntryId = null, boardTimer = null;

  /* ---------- pengaturan ---------- */
  const settings = Object.assign({ duration: CFG.durationSec, sound: true }, loadSettings());
  function loadSettings() { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); } catch (e) { return {}; } }
  function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) { /* abaikan */ } }

  /* ---------- ukuran panggung 16:9 ---------- */
  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    let w = vw, h = (vw * 9) / 16;
    if (h > vh) { h = vh; w = (vh * 16) / 9; }
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    document.documentElement.style.setProperty('--u', w / 100 + 'px');
    const dpr = window.devicePixelRatio || 1;
    J.R = J.clamp((w * dpr) / W, 0.6, 1.6);
    canvas.width = Math.round(W * J.R);
    canvas.height = Math.round(H * J.R);
  }

  /* ---------- layar awal (demo hutan bergerak pelan) ---------- */
  const attract = {
    scene: null, t0: 0,
    refresh() {
      this.scene = J.Scene.generate(0, {
        R: J.R, mode: J.rng(J.randomSeed()).pick(['pagi', 'siang', 'senja']),
        diff: { count: [3, 4], scale: 0.7, occl: 0.25, minVis: 0.6, black: 0.4, minBlack: 1, decoys: 2, cub: 0.8, density: 0.55, light: 0.4, camo: 0.35, hide: 0, mode: 'pagi' }
      });
      this.t0 = J.now();
    },
    render(now) {
      if (!this.scene) return;
      const t = now - this.t0;
      const z = 1.05 + 0.025 * Math.sin(t * 0.15), px = Math.sin(t * 0.06) * 30;
      // hanya sorot macan tutul yang tidak tertutup panel di sisi kanan
      const leos = this.scene.leopards.filter((l) => !(l.cx > 1000 && l.cy < 600));
      const idx = Math.floor(t / 3.2) % Math.max(1, leos.length);
      const ph = (t % 3.2) / 3.2;
      leos.forEach((l, i) => { l.demo = i === idx ? Math.min(1, Math.sin(ph * Math.PI) * 1.6) : 0; });
      ctx.save();
      ctx.translate(W / 2 + px, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
      J.drawScene(ctx, this.scene, now);
      ctx.restore();
    }
  };

  const game = new J.Game({ onEnd: (res) => goto('result', res) });

  /* ---------- alur layar ---------- */
  function goto(next, data) {
    const prev = state;
    state = next;
    lastInput = J.now();
    UI.clearBubbles();
    clearTimeout(boardTimer);
    if (prev === 'attract') { UI.stopAttractFacts(); J.Audio.ambient(false); }
    if (next === 'attract') {
      game.stop();
      attract.refresh();
      UI.show('screen-attract');
      UI.renderMiniBoard();
      UI.startAttractFacts();
      if (settings.sound) J.Audio.ambient(true);
    } else if (next === 'briefing') {
      UI.show('screen-briefing');
    } else if (next === 'play') {
      UI.show(null);
      game.start(settings.duration);
    } else if (next === 'result') {
      pendingResult = data;
      showResult(data);
    } else if (next === 'board') {
      UI.show('screen-board');
      UI.renderBoards(data && data.highlight);
      boardTimer = setTimeout(() => { if (state === 'board') goto('attract'); }, CFG.boardAutoReturnSec * 1000);
    }
  }

  function showResult(res) {
    UI.show('screen-result');
    $('result-score').textContent = res.score;
    $('result-stations').textContent = res.stages;
    $('result-mistakes').textContent = res.mistakes;
    $('result-rank').textContent = '#' + J.Leaderboard.wouldRank('today', res.score, res.mistakes);
    const titles = C.ui.resultTitles;
    $('result-title').textContent = titles[res.score >= 14 ? 2 : res.score >= 7 ? 1 : 0];
    $('result-action').textContent = C.actions[Math.floor(Math.random() * C.actions.length)];
    UI.setName('');
  }
  function saveResult(skip) {
    if (!pendingResult) return;
    const name = skip ? C.ui.defaultName : UI.cleanName(UI.getName());
    const e = J.Leaderboard.add({ name, score: pendingResult.score, stages: pendingResult.stages, mistakes: pendingResult.mistakes });
    lastEntryId = e.id;
    pendingResult = null;
    J.Audio.click();
    goto('board', { highlight: lastEntryId });
  }

  /* ---------- loop gambar ---------- */
  function frame(ts) {
    const now = ts / 1000;
    const dt = Math.min(0.05, lastFrame ? now - lastFrame : 0);
    lastFrame = now;
    ctx.setTransform(J.R, 0, 0, J.R, 0, 0);
    const nowS = J.now();
    if (state === 'play' || state === 'result') {
      game.update(dt, nowS);
      game.render(ctx, nowS);
    } else {
      attract.render(nowS);
    }
    if (!vignette || vignR !== J.R) { vignette = A.Forest.vignette(W, H, J.R, 0.42); vignR = J.R; }
    ctx.drawImage(vignette, 0, 0, W, H);
    // kembali ke layar awal jika ditinggal
    if (state !== 'attract' && state !== 'play' && !UI.isOpen('overlay-admin') && nowS - lastInput > CFG.idleTimeoutSec) goto('attract');
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H, scale: W / r.width };
  }
  canvas.addEventListener('pointerdown', (e) => {
    if (state !== 'play') return;
    e.preventDefault();
    const p = toLogical(e);
    const tolPx = e.pointerType === 'mouse' ? CFG.tolMouse : CFG.tolTouch;
    game.pointer(p.x, p.y, tolPx * p.scale);
  });
  window.addEventListener('pointerdown', () => { lastInput = J.now(); J.Audio.unlock(); }, true);
  window.addEventListener('keydown', (e) => {
    lastInput = J.now();
    if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) { e.preventDefault(); openAdmin(); return; }
    if (UI.isOpen('overlay-admin')) return;
    if (state === 'result') {
      if (e.key === 'Enter') saveResult(false);
      else if (e.key === 'Backspace') { e.preventDefault(); UI.typeKey('DEL'); }
      else if (e.key === ' ') { e.preventDefault(); UI.typeKey('SPACE'); }
      else if (e.key.length === 1) UI.typeKey(e.key);
    } else if (state === 'attract' && (e.key === 'Enter' || e.key === ' ')) { J.Audio.unlock(); goto('briefing'); }
    else if (state === 'briefing' && (e.key === 'Enter' || e.key === ' ')) goto('play');
  });

  // mode kiosk: cegah zoom, menu klik kanan, seleksi
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
  document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  /* ---------- tombol ---------- */
  function on(id, fn) { $(id).addEventListener('click', (e) => { e.stopPropagation(); fn(e); }); }
  $('screen-attract').addEventListener('click', () => { if (state === 'attract') { J.Audio.unlock(); J.Audio.click(); goto('briefing'); } });
  on('btn-start', () => { J.Audio.unlock(); J.Audio.click(); goto('briefing'); });
  on('btn-board', () => { J.Audio.click(); goto('board'); });
  on('btn-fullscreen', () => toggleFullscreen());
  on('btn-go', () => { J.Audio.click(); goto('play'); });
  on('btn-save', () => saveResult(false));
  on('btn-skip', () => saveResult(true));
  on('btn-again', () => { J.Audio.click(); goto('briefing'); });
  on('btn-home', () => { J.Audio.click(); goto('attract'); });
  on('btn-mute', () => { settings.sound = !settings.sound; applySound(); saveSettings(); });

  function applySound() {
    J.Audio.setEnabled(settings.sound);
    $('btn-mute').classList.toggle('is-off', !settings.sound);
    if (settings.sound && state === 'attract') J.Audio.ambient(true);
  }
  function toggleFullscreen() {
    const d = document;
    if (!d.fullscreenElement && !d.webkitFullscreenElement) {
      const el = d.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
    } else (d.exitFullscreen || d.webkitExitFullscreen || function () {}).call(d);
  }

  /* ---------- admin ---------- */
  let hotTaps = [];
  $('admin-hotspot').addEventListener('click', (e) => {
    e.stopPropagation();
    const now = J.now();
    hotTaps = hotTaps.filter((t) => now - t < 3).concat(now);
    if (hotTaps.length >= 5) { hotTaps = []; openAdmin(); }
  });
  function openAdmin() {
    if (state === 'play') return;
    UI.overlay('overlay-admin', true);
    $('admin-pin').classList.remove('hidden');
    adminMsg('');
    $('admin-menu').classList.add('hidden');
    UI.askPin((pin) => {
      if (pin === String(CFG.adminPin)) { $('admin-pin').classList.add('hidden'); $('admin-menu').classList.remove('hidden'); renderAdmin(); }
      else UI.pinError();
    });
  }
  function closeAdmin() { UI.overlay('overlay-admin', false); if (state === 'attract') UI.renderMiniBoard(); if (state === 'board') UI.renderBoards(lastEntryId); }
  function renderAdmin() {
    const dur = $('admin-durations');
    dur.innerHTML = '';
    for (const s of CFG.durationOptions) {
      const b = document.createElement('button');
      b.className = 'btn' + (settings.duration === s ? ' on' : '');
      b.textContent = J.tpl(C.ui.adminSeconds, { s });
      b.onclick = (e) => { e.stopPropagation(); settings.duration = s; saveSettings(); renderAdmin(); };
      dur.appendChild(b);
    }
    const snd = $('admin-sound');
    snd.innerHTML = '';
    for (const v of [true, false]) {
      const b = document.createElement('button');
      b.className = 'btn' + (settings.sound === v ? ' on' : '');
      b.textContent = v ? C.ui.adminOn : C.ui.adminOff;
      b.onclick = (e) => { e.stopPropagation(); settings.sound = v; applySound(); saveSettings(); renderAdmin(); };
      snd.appendChild(b);
    }
  }
  on('btn-admin-cancel', closeAdmin);
  on('btn-admin-close', closeAdmin);
  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function adminMsg(text, err) {
    const m = $('admin-msg');
    m.textContent = text || '';
    m.classList.toggle('err', !!err);
  }
  on('btn-admin-export', () => {
    download('skor-jejak-si-macan-tutul-' + J.Leaderboard.dayKey() + '.csv', '\ufeff' + J.Leaderboard.csv(), 'text/csv;charset=utf-8');
  });
  on('btn-admin-backup', () => {
    const stamp = J.Leaderboard.dayKey() + '-' + new Date().toTimeString().slice(0, 5).replace(':', '');
    download('cadangan-jejak-si-macan-tutul-' + stamp + '.json', JSON.stringify(J.Leaderboard.backup(settings), null, 1), 'application/json');
    adminMsg(C.ui.adminBackupDone);
  });
  on('btn-admin-import', () => { $('admin-import-file').value = ''; $('admin-import-file').click(); });
  $('admin-import-file').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(String(rd.result).replace(/^\ufeff/, ''));
        const res = J.Leaderboard.importBackup(data);
        if (data && data.settings && typeof data.settings === 'object') {
          if (CFG.durationOptions.includes(data.settings.duration)) settings.duration = data.settings.duration;
          if (typeof data.settings.sound === 'boolean') settings.sound = data.settings.sound;
          saveSettings(); applySound(); renderAdmin();
        }
        adminMsg(J.tpl(C.ui.adminImported, res));
      } catch (err) { adminMsg(C.ui.adminImportFail, true); }
    };
    rd.onerror = () => adminMsg(C.ui.adminImportFail, true);
    rd.readAsText(f);
  });
  on('btn-admin-reset-today', () => { if (confirm(C.ui.adminConfirm)) J.Leaderboard.resetToday(); });
  on('btn-admin-reset-all', () => { if (confirm(C.ui.adminConfirm)) J.Leaderboard.resetAll(); });

  /* ---------- ikon aturan main ---------- */
  function ruleIcons() {
    const mk = (o) => A.leopardSprite(Object.assign({ R: 2, flip: false }, o)).canvas.toDataURL();
    return {
      spotted: mk({ pose: 'sit', variant: 'spotted', scale: 0.6 }),
      black: mk({ pose: 'sit', variant: 'black', scale: 0.6 }),
      kuwuk: A.animalSprite('kuwuk', { scale: 1.3, R: 2, pose: 'sit' }).canvas.toDataURL()
    };
  }

  /* ---------- mulai ---------- */
  function boot() {
    resize();
    window.addEventListener('resize', resize);
    UI.init();
    UI.buildRules(ruleIcons());
    applySound();
    goto('attract');
    $('loading').classList.add('done');
    requestAnimationFrame(frame);
    if ('wakeLock' in navigator) {
      const lock = () => navigator.wakeLock.request('screen').catch(() => {});
      lock();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lock(); });
    }
    if (!window.JSMT_SINGLE_FILE && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }

  // akses untuk pengujian otomatis
  J.debug = { game, attract, goto, get state() { return state; }, settings };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
